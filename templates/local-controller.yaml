# Native administrator-owned local platform configuration.
# Copy this file to .broker/local-controller.yaml and replace the illustrative
# direct profile with your broker-backed, mediated profiles before use.
api_version: nvt.local-platform/v1

defaults:
  image: nvt-agent-runtime:latest
  runtime:
    type: local-agent
    autonomy: trusted-local
    user: root
  agent_config:
    runtime:
      command: bash
      args: [-lc, "while :; do sleep 3600; done"]
      resume:
        command: bash
        args: [-lc, "while :; do sleep 3600; done"]
    plugins: []
  resources: {}
  lifecycle: {}

execution_backends:
  - name: local-docker
    kind: docker

retention_policies:
  - name: persistent
    persistence:
      workspace: true
      runtime_state: true
      docker_data: true
    ttl: {}
  - name: disposable
    persistence:
      workspace: false
      runtime_state: false
      docker_data: false
    ttl:
      active_seconds: 3600
      completed_seconds: 300
      failed_seconds: 900
      run_retention_seconds: 86400

profiles:
  - name: trusted-local
    broker: {grants: []}
    egress: {mode: direct}
    allowed_backends: [local-docker]
    default_backend: local-docker
    allowed_retentions: [persistent, disposable]

workflows:
  - name: nvt-development
    workspace_instructions: Work in the NVT agent repository.
  - name: studio-development
    workspace_instructions: Work in the Studio repositories selected by this workflow.
  - name: infrastructure
    workspace_instructions: Work in the infrastructure repositories selected by this workflow.

workstations:
  - name: nvt
    principal:
      issuer: https://local.nvt.invalid
      subject: workstation-nvt
      display_name: NVT development
    profile: trusted-local
    workflow: nvt-development
    retention: persistent
    backend: local-docker
  - name: studio
    principal:
      issuer: https://local.nvt.invalid
      subject: workstation-studio
      display_name: Studio development
    profile: trusted-local
    workflow: studio-development
    retention: persistent
    backend: local-docker
  - name: infra
    principal:
      issuer: https://local.nvt.invalid
      subject: workstation-infra
      display_name: Infrastructure development
    profile: trusted-local
    workflow: infrastructure
    retention: persistent
    backend: local-docker

schedules: []
