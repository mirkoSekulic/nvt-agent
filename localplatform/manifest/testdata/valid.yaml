apiVersion: nvt.dev/local/v1
retentionPolicies:
  persistent:
    persistence:
      workspace: true
      runtimeState: true
      dockerData: true
  retained:
    persistence:
      workspace: true
      runtimeState: true
      dockerData: true
    ttl:
      activeSeconds: 86400
  disposable:
    ttl:
      activeSeconds: 604800
      completedSeconds: 300
      failedSeconds: 900
      runRetentionSeconds: 86400
secrets:
  github-key:
    file: ./.nvt-local/secrets/github/main-app.pem
  azure-token:
    file: ./.nvt-local/secrets/azure/infra-pat
accounts:
  github:
    preset: github-app
    appId: "3912708"
    privateKeySecret: github-key
    installations:
      mirkoSekulic: "123"
  codex:
    preset: codex-oauth
brokerProviders:
  azure:
    plugin: token
    secrets:
      token-file: azure-token
    mediation:
      hosts: [dev.azure.com]
      materialization: header-inject
      git: true
      username: git
      targetMode: literal
profiles:
  development:
    runtime:
      preset: codex
      autonomy: trusted-local
      account: codex
      model: gpt-5.6-sol
      effort: high
    accounts: [github, codex]
    credentialProviders: [azure]
    defaultCredentialProvider: github
    tools:
      packages: [jq, git]
      mise: [go@latest]
    capabilities: [SYS_PTRACE]
    plugins:
      - work-control
      - name: github-watcher
        when: after-agent
        restart: always
        egress:
          provider: github
        config:
          poll-seconds: 30
    instructions:
      file: ./.nvt-local/instructions/development.md
repositories:
  nvt-agent:
    github: mirkoSekulic/nvt-agent
    account: github
  infrastructure:
    url: https://dev.azure.com/example/platform/_git/infrastructure
    checkoutTarget: dev.azure.com/example/platform/_git/infrastructure
    brokerRepository: dev.azure.com/example/platform/_git/infrastructure
    path: infrastructure
    credentialProvider: azure
workstations:
  - name: nvt
    profile: development
    repositories: [nvt-agent]
  - name: infra
    profile: development
    repositories: [infrastructure]
workflows:
  nvt-development:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.github.pr.merged, plugin.github.pr.closed]
  nvt-review:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.work.completed]
      failOn: [plugin.work.failed]
  infrastructure:
    profile: development
    repository: infrastructure
    retention: retained
producers:
  - name: nvt-comments
    preset: github-comments
    account: github
    repository: nvt-agent
    prefix: /nvtagent
    allowedAuthors: [mirkoSekulic]
    workflow: nvt-development
    commandWorkflows:
      review: nvt-review
      run: nvt-review
      pr-continue: nvt-development
  - name: external-chat
    image: ghcr.io/example/chat-producer@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    runtimeIdentity:
      uid: 1000
      gid: 1000
    workflow: nvt-development
    allowedPrincipalIssuers: [https://chat.example]
    publicConfig:
      commandPrefix: /agent
