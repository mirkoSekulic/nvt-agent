services:
  broker:
    image: nvt-broker:latest
    env_file:
      - .broker/env
    environment:
      NVT_BROKER_CONFIG: /state/broker.yaml
      NVT_BROKER_AGENTS_CONFIG: /state/agents.yaml
      NVT_BROKER_AUDIT_LOG: /state/audit.jsonl
      NVT_BROKER_BIND: 0.0.0.0:7347
    volumes:
      - ./.broker:/state
    networks:
      - agents-proxy
      - local-control-plane
    restart: unless-stopped

  proxy:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=agents-proxy
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:${NVT_PROXY_PORT:-4090}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agents-proxy
    restart: unless-stopped

  gateway:
    image: nvt-agent-gateway:latest
    container_name: nvt-local-gateway
    user: "${NVT_LOCAL_GATEWAY_UID:-65532}:${NVT_LOCAL_GATEWAY_GID:-65532}"
    environment:
      NVT_GATEWAY_LISTEN_ADDR: 0.0.0.0:8080
      NVT_GATEWAY_BASE_DOMAIN: localhost
      NVT_GATEWAY_AUTH_MODE: ${NVT_GATEWAY_AUTH_MODE:-none}
      NVT_GATEWAY_AUTHORIZATION: ${NVT_GATEWAY_AUTHORIZATION:-}
      NVT_GATEWAY_LOCAL_RUNS_ENABLED: "true"
      NVT_GATEWAY_LOCAL_RUNS_DISABLE_KUBERNETES: "true"
      NVT_GATEWAY_LOCAL_RUNS_CONTROLLER_URL: http://local-controller:7480
      NVT_GATEWAY_LOCAL_RUNS_TOKEN_FILE: /run/secrets/local-controller-route-token
      NVT_GATEWAY_LOCAL_RUNS_BASE_DOMAIN: agent.localhost
      NVT_GATEWAY_LOCAL_RUNS_PATH_PREFIX: /agents
    networks:
      - agents-proxy
      - local-control-plane
    volumes:
      - ./.broker/local-controller-route-token:/run/secrets/local-controller-route-token:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=agents-proxy
      - traefik.http.routers.nvt-local-gateway.rule=Host(`localhost`) && (PathPrefix(`/agents`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.nvt-local-gateway.entrypoints=web
      - traefik.http.routers.nvt-local-gateway.service=nvt-local-gateway
      - traefik.http.routers.nvt-local-gateway-host.rule=HostRegexp(`[a-z0-9-]+\.agent\.localhost`)
      - traefik.http.routers.nvt-local-gateway-host.entrypoints=web
      - traefik.http.routers.nvt-local-gateway-host.service=nvt-local-gateway
      - traefik.http.routers.nvt-local-gateway-host.priority=1
      - traefik.http.routers.nvt-local-gateway-exposure.rule=HostRegexp(`[a-z0-9-]+\.[a-z0-9-]+\.agent\.localhost`)
      - traefik.http.routers.nvt-local-gateway-exposure.entrypoints=web
      - traefik.http.routers.nvt-local-gateway-exposure.service=nvt-local-gateway
      - traefik.http.routers.nvt-local-gateway-exposure.priority=1
      - traefik.http.services.nvt-local-gateway.loadbalancer.server.port=8080
      - nvt.dev/local-gateway=true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  local-controller:
    image: nvt-local-controller:latest
    environment:
      NVT_LOCAL_CONTROLLER_BIND: 0.0.0.0:7480
      NVT_LOCAL_CONTROLLER_STATE: /state/controller/local-controller.sqlite3
      NVT_LOCAL_CONTROLLER_MAX_ACTIVE_RUNS: ${NVT_LOCAL_CONTROLLER_MAX_ACTIVE_RUNS:-32}
      NVT_LOCAL_CONTROLLER_MAX_CLAIM_LEASE_SECONDS: ${NVT_LOCAL_CONTROLLER_MAX_CLAIM_LEASE_SECONDS:-180}
      NVT_LOCAL_CONTROLLER_BACKEND_TIMEOUT_SECONDS: ${NVT_LOCAL_CONTROLLER_BACKEND_TIMEOUT_SECONDS:-120}
      NVT_LOCAL_CONTROLLER_SWEEP_SECONDS: ${NVT_LOCAL_CONTROLLER_SWEEP_SECONDS:-1}
      NVT_LOCAL_CONTROLLER_RECONCILE_SECONDS: ${NVT_LOCAL_CONTROLLER_RECONCILE_SECONDS:-1}
      NVT_LOCAL_CONTROLLER_DOCKER_HOST: unix:///var/run/docker.sock
      NVT_LOCAL_CONTROLLER_RUNS_DIR: /state/controller/runs
      NVT_LOCAL_CONTROLLER_BROKER_URL: http://broker:7347
      NVT_LOCAL_CONTROLLER_BROKER_AGENTS: /broker-state/agents.yaml
      NVT_LOCAL_CONTROLLER_IDENTITY_KEY_FILE: /broker-state/local-controller.key
      NVT_LOCAL_CONTROLLER_EXTERNAL_NETWORK: agents-proxy
      NVT_LOCAL_CONTROLLER_ROUTE_BASE_DOMAIN: agent.localhost
      NVT_LOCAL_CONTROLLER_ROUTE_PATH_PREFIX: /agents
      NVT_LOCAL_CONTROLLER_GATEWAY_CONTAINER: nvt-local-gateway
      NVT_LOCAL_CONTROLLER_CONFIG: ${NVT_LOCAL_CONTROLLER_CONFIG:-}
      NVT_LOCAL_CONTROLLER_ADMIN_TOKEN_FILE: /broker-state/local-controller-admin-token
      NVT_LOCAL_CONTROLLER_ROUTE_TOKEN_FILE: /broker-state/local-controller-route-token
      NVT_LOCAL_CONTROLLER_RUN_NETWORK_POOL: ${NVT_LOCAL_CONTROLLER_RUN_NETWORK_POOL:-100.64.0.0/10}
      NVT_LOCAL_CONTROLLER_PROXY_PORT: ${NVT_PROXY_PORT:-4090}
      NVT_LOCAL_CONTROLLER_DIND_PROTECTED_CIDRS: ${NVT_DIND_PROTECTED_CIDRS:-127.0.0.0/8 169.254.0.0/16}
      NVT_LOCAL_CONTROLLER_DIND_IMAGE: ${DIND_IMAGE:-nvt-dind:latest}
      NVT_LOCAL_CONTROLLER_EGRESSD_IMAGE: ${EGRESSD_IMAGE:-nvt-egressd:latest}
      NVT_LOCAL_CONTROLLER_CAPTURED_IMAGE: ${CAPTURED_IMAGE:-nvt-captured:latest}
      NVT_LOCAL_CONTROLLER_SEED_IMAGE: ${RUNTIME_IMAGE:-nvt-agent-runtime:latest}
    volumes:
      - local-controller-state:/state
      - ./.broker:/broker-state
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - local-control-plane
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

networks:
  agents-proxy:
    external: true
  local-control-plane:
    internal: true

volumes:
  local-controller-state:
