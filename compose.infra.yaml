services:
  broker:
    image: nvt-broker:latest
    env_file:
      - .broker/env
    environment:
      NVT_BROKER_CONFIG: /state/broker.yaml
      NVT_BROKER_AGENTS_CONFIG: /state/agents.yaml
      NVT_BROKER_AUDIT_LOG: /state/audit.jsonl
      NVT_BROKER_BIND: 0.0.0.0:7347
      NVT_BROKER_SEED_DIR: ${NVT_BROKER_CREDENTIAL_SEED_DIR:-}
      NVT_BROKER_STATE_DIR: /private
      NVT_BROKER_SEED_TARGET_DIR: portal
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        if [ -n "$${NVT_BROKER_SEED_DIR:-}" ]; then
          exec /opt/nvt-broker/broker/seed_supervisor.py -- /opt/nvt-broker/broker/brokerd.py
        fi
        exec /opt/nvt-broker/broker/brokerd.py
    volumes:
      - ./.broker:/state
      - local-credential-seeds:/portal-seed:ro
      - local-broker-private:/private
    networks:
      - agents-proxy
      - local-control-plane
    restart: unless-stopped

  proxy:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=agents-proxy
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:${NVT_PROXY_PORT:-4090}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agents-proxy
    restart: unless-stopped

  local-controller-private-init:
    image: nvt-local-controller:latest
    user: "0:0"
    network_mode: none
    environment:
      NVT_LOCAL_GATEWAY_UID: ${NVT_LOCAL_GATEWAY_UID:-65532}
      NVT_LOCAL_GATEWAY_GID: ${NVT_LOCAL_GATEWAY_GID:-65532}
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        umask 077
        test -s /source/local-controller.key
        test -s /source/local-controller-admin-token
        test -s /source/local-controller-route-token
        cp /source/local-controller.key /private/local-controller.key.next
        chown 0:0 /private/local-controller.key.next
        chmod 0600 /private/local-controller.key.next
        mv -f /private/local-controller.key.next /private/local-controller.key
        cp /source/local-controller-admin-token /private/local-controller-admin-token.next
        chown 0:0 /private/local-controller-admin-token.next
        chmod 0600 /private/local-controller-admin-token.next
        mv -f /private/local-controller-admin-token.next /private/local-controller-admin-token
        cp /source/local-controller-route-token /private/local-controller-route-token.next
        chown 0:0 /private/local-controller-route-token.next
        chmod 0600 /private/local-controller-route-token.next
        mv -f /private/local-controller-route-token.next /private/local-controller-route-token
        cp /source/local-controller-route-token /gateway-private/local-controller-route-token.next
        chown "$${NVT_LOCAL_GATEWAY_UID}:$${NVT_LOCAL_GATEWAY_GID}" /gateway-private/local-controller-route-token.next
        chmod 0400 /gateway-private/local-controller-route-token.next
        mv -f /gateway-private/local-controller-route-token.next /gateway-private/local-controller-route-token
    volumes:
      - ./.broker:/source:ro
      - local-controller-private:/private
      - local-gateway-private:/gateway-private
    restart: "no"

  gateway:
    image: nvt-agent-gateway:latest
    container_name: nvt-local-gateway
    user: "${NVT_LOCAL_GATEWAY_UID:-65532}:${NVT_LOCAL_GATEWAY_GID:-65532}"
    environment:
      NVT_GATEWAY_LISTEN_ADDR: 0.0.0.0:8080
      NVT_GATEWAY_BASE_DOMAIN: localhost
      NVT_GATEWAY_AUTH_MODE: ${NVT_GATEWAY_AUTH_MODE:-none}
      NVT_GATEWAY_AUTHORIZATION: ${NVT_GATEWAY_AUTHORIZATION:-}
      NVT_GATEWAY_LOCAL_RUNS_ENABLED: "true"
      NVT_GATEWAY_LOCAL_RUNS_DISABLE_KUBERNETES: "true"
      NVT_GATEWAY_LOCAL_RUNS_CONTROLLER_URL: http://local-controller:7480
      NVT_GATEWAY_LOCAL_RUNS_TOKEN_FILE: /run/secrets/local-controller-route-token
      NVT_GATEWAY_LOCAL_RUNS_BASE_DOMAIN: agent.localhost
      NVT_GATEWAY_LOCAL_RUNS_PATH_PREFIX: /agents
      NVT_GATEWAY_CREDENTIAL_PORTAL_URL: ${NVT_GATEWAY_CREDENTIAL_PORTAL_URL:-}
    networks:
      - agents-proxy
      - local-control-plane
    depends_on:
      local-controller-private-init:
        condition: service_completed_successfully
    volumes:
      - local-gateway-private:/run/secrets:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=agents-proxy
      - traefik.http.routers.nvt-local-gateway.rule=Host(`localhost`) && (PathPrefix(`/agents`) || PathPrefix(`/oauth2`) || PathPrefix(`/healthz/branding/`))
      - traefik.http.routers.nvt-local-gateway.entrypoints=web
      - traefik.http.routers.nvt-local-gateway.service=nvt-local-gateway
      - traefik.http.routers.nvt-local-gateway-host.rule=HostRegexp(`[a-z0-9-]+\.agent\.localhost`)
      - traefik.http.routers.nvt-local-gateway-host.entrypoints=web
      - traefik.http.routers.nvt-local-gateway-host.service=nvt-local-gateway
      - traefik.http.routers.nvt-local-gateway-host.priority=1
      - traefik.http.routers.nvt-local-gateway-exposure.rule=HostRegexp(`[a-z0-9-]+\.[a-z0-9-]+\.agent\.localhost`)
      - traefik.http.routers.nvt-local-gateway-exposure.entrypoints=web
      - traefik.http.routers.nvt-local-gateway-exposure.service=nvt-local-gateway
      - traefik.http.routers.nvt-local-gateway-exposure.priority=1
      - traefik.http.services.nvt-local-gateway.loadbalancer.server.port=8080
      - nvt.dev/local-gateway=true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  credential-private-init:
    profiles: [credentials]
    image: nvt-credential-portal:latest
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        umask 077
        mkdir -p /private /seed
        if [ ! -s /private/runner.key ]; then /nvt-credential-portal runner-keygen /private/runner.key; fi
        if [ ! -s /private/session.key ]; then /nvt-credential-portal runner-keygen /private/session.key; fi
        chown -R 1000:1000 /private /seed
        chmod 0700 /private /seed
        chmod 0600 /private/runner.key /private/session.key
    volumes:
      - local-credential-private:/private
      - local-credential-seeds:/seed
    restart: "no"

  credential-runner:
    profiles: [credentials]
    image: nvt-credential-portal:latest
    command: [runner, --listen, 0.0.0.0:8081, --auth-key-file, /private/runner.key]
    volumes:
      - local-credential-private:/private:ro
    networks: [local-control-plane]
    depends_on:
      credential-private-init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  credential-portal:
    profiles: [credentials]
    image: nvt-credential-portal:latest
    environment:
      NVT_CREDENTIAL_PORTAL_CONFIG: /config/config.json
      NVT_CREDENTIAL_PORTAL_PUBLIC_URL: http://localhost:${NVT_PROXY_PORT:-4090}/agents/credentials
      NVT_CREDENTIAL_PORTAL_SESSION_SECRET_FILE: /private/session.key
      NVT_CREDENTIAL_RUNNER_AUTH_KEY_FILE: /private/runner.key
      NVT_CREDENTIAL_RUNNER_URL: http://credential-runner:8081
    volumes:
      - ./.broker/credential-portal-local.json:/config/config.json:ro
      - local-credential-private:/private:ro
      - local-credential-seeds:/seed
    networks: [agents-proxy, local-control-plane]
    depends_on:
      credential-private-init: {condition: service_completed_successfully}
      credential-runner: {condition: service_started}
    labels:
      - traefik.enable=true
      - traefik.docker.network=agents-proxy
      - traefik.http.routers.nvt-local-credentials.rule=Host(`localhost`) && PathPrefix(`/agents/credentials`)
      - traefik.http.routers.nvt-local-credentials.entrypoints=web
      - traefik.http.routers.nvt-local-credentials.priority=100
      - traefik.http.services.nvt-local-credentials.loadbalancer.server.port=8080
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  local-controller:
    image: nvt-local-controller:latest
    environment:
      NVT_LOCAL_CONTROLLER_BIND: 0.0.0.0:7480
      NVT_LOCAL_CONTROLLER_STATE: /state/controller/local-controller.sqlite3
      NVT_LOCAL_CONTROLLER_MAX_ACTIVE_RUNS: ${NVT_LOCAL_CONTROLLER_MAX_ACTIVE_RUNS:-32}
      NVT_LOCAL_CONTROLLER_MAX_CLAIM_LEASE_SECONDS: ${NVT_LOCAL_CONTROLLER_MAX_CLAIM_LEASE_SECONDS:-180}
      NVT_LOCAL_CONTROLLER_BACKEND_TIMEOUT_SECONDS: ${NVT_LOCAL_CONTROLLER_BACKEND_TIMEOUT_SECONDS:-120}
      NVT_LOCAL_CONTROLLER_SWEEP_SECONDS: ${NVT_LOCAL_CONTROLLER_SWEEP_SECONDS:-1}
      NVT_LOCAL_CONTROLLER_RECONCILE_SECONDS: ${NVT_LOCAL_CONTROLLER_RECONCILE_SECONDS:-1}
      NVT_LOCAL_CONTROLLER_DOCKER_HOST: unix:///var/run/docker.sock
      NVT_LOCAL_CONTROLLER_RUNS_DIR: /state/controller/runs
      NVT_LOCAL_CONTROLLER_BROKER_URL: http://broker:7347
      NVT_LOCAL_CONTROLLER_BROKER_AGENTS: /broker-state/agents.yaml
      NVT_LOCAL_CONTROLLER_IDENTITY_KEY_FILE: /controller-private/local-controller.key
      NVT_LOCAL_CONTROLLER_EXTERNAL_NETWORK: agents-proxy
      NVT_LOCAL_CONTROLLER_ROUTE_BASE_DOMAIN: agent.localhost
      NVT_LOCAL_CONTROLLER_ROUTE_PATH_PREFIX: /agents
      NVT_LOCAL_CONTROLLER_GATEWAY_CONTAINER: nvt-local-gateway
      NVT_LOCAL_CONTROLLER_CONFIG: ${NVT_LOCAL_CONTROLLER_CONFIG:-}
      NVT_LOCAL_CONTROLLER_ADMIN_TOKEN_FILE: /controller-private/local-controller-admin-token
      NVT_LOCAL_CONTROLLER_ROUTE_TOKEN_FILE: /controller-private/local-controller-route-token
      NVT_LOCAL_CONTROLLER_RUN_NETWORK_POOL: ${NVT_LOCAL_CONTROLLER_RUN_NETWORK_POOL:-100.64.0.0/10}
      NVT_LOCAL_CONTROLLER_PROXY_PORT: ${NVT_PROXY_PORT:-4090}
      NVT_LOCAL_CONTROLLER_DIND_PROTECTED_CIDRS: ${NVT_DIND_PROTECTED_CIDRS:-127.0.0.0/8 169.254.0.0/16}
      NVT_LOCAL_CONTROLLER_DIND_IMAGE: ${DIND_IMAGE:-nvt-dind:latest}
      NVT_LOCAL_CONTROLLER_EGRESSD_IMAGE: ${EGRESSD_IMAGE:-nvt-egressd:latest}
      NVT_LOCAL_CONTROLLER_CAPTURED_IMAGE: ${CAPTURED_IMAGE:-nvt-captured:latest}
      NVT_LOCAL_CONTROLLER_SEED_IMAGE: ${RUNTIME_IMAGE:-nvt-agent-runtime:latest}
    volumes:
      - local-controller-state:/state
      - ./.broker:/broker-state
      - local-controller-private:/controller-private:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - local-control-plane
    depends_on:
      local-controller-private-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

networks:
  agents-proxy:
    external: true
  local-control-plane:
    internal: true

volumes:
  local-controller-state:
  local-controller-private:
  local-gateway-private:
  local-credential-private:
  local-credential-seeds:
  local-broker-private:
