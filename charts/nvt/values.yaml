namespace:
  name: ""
  create: false

global:
  # Required when installing this source checkout without component tag
  # overrides. Published OCI packages set Chart.AppVersion to this value.
  imageTag: ""

runtime:
  image:
    repository: ghcr.io/mirkosekulic/nvt-agent-runtime
    tag: ""
    pullPolicy: IfNotPresent

# Optional administrator-owned public branding bundle. The ConfigMap must be
# in the release namespace and contain every fixed key documented in the chart
# README. Empty keeps the coordinated images' built-in NVT Agent branding.
branding:
  existingConfigMap: ""

dind:
  # Include cluster Pod, Service, control-plane, broker, and other protected
  # ranges. Transparent AgentRuns fail closed if any overlaps 172.30.0.0/15.
  protectedCIDRs:
    - 127.0.0.0/8
    - 169.254.0.0/16
  image:
    repository: ghcr.io/mirkosekulic/nvt-dind
    tag: ""
    pullPolicy: IfNotPresent

egress:
  egressd:
    image:
      repository: ghcr.io/mirkosekulic/nvt-egressd
      tag: ""
      pullPolicy: IfNotPresent
  captured:
    image:
      repository: ghcr.io/mirkosekulic/nvt-captured
      tag: ""
      pullPolicy: IfNotPresent
  networkPolicyCapable: false
  allowedTCPPorts:
    - 80
    - 443
  # Additional deployment Pod, Service, node, cluster, and VNet ranges. The
  # operator always adds its built-in IANA non-public and transition ranges.
  denyCIDRs: []
  # Cluster default egress mode for AgentRuns created through the nvt
  # admission/schedule path (producers/schedules) that leave spec.egress
  # empty. Applied once, at creation — flipping it never reclassifies an
  # existing run. Default "direct". A raw `kubectl apply` of an AgentRun with
  # empty egress is defaulted to "direct" by the CRD schema regardless of this
  # knob (docs/transparent-egress-architecture.md).
  defaultMode: direct
  # Opt into the per-grant allowInsecureUpstream escape hatch (plaintext
  # upstream leg). Test/dev only, for hermetic in-cluster fixtures that cannot
  # present a publicly-trusted cert. Leave false in any real deployment: a
  # plaintext upstream carrying an injected credential is a conformance
  # failure, and admission rejects the flag unless this is set.
  allowInsecureUpstreams: false

broker:
  enabled: true
  image:
    repository: ghcr.io/mirkosekulic/nvt-broker
    tag: ""
    pullPolicy: IfNotPresent
  envSecretName: ""
  # Non-secret GitOps rotation generation for the dynamic principal assertion
  # key in envSecretName. Dynamic portal deployments require a non-empty value;
  # change it in the same release update as the external Secret key.
  dynamicAccountAssertionRotationEpoch: ""
  tls:
    # Serve the broker over TLS. The egressd->broker leg carries real
    # credentials through the agent's network namespace, so mediated
    # production runs require it (protocol/injection.md). When enabled
    # and no existingSecret is given, the chart generates a self-signed CA +
    # serving cert into secretName (preserved across upgrades). The CA cert
    # is public material distributed to egressd and the agent by the operator.
    enabled: true
    secretName: nvt-broker-tls
    existingSecret: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
    existingClaim: ""
    # Optional read-only Kubernetes Secret source. Each top-level key is
    # reconciled independently into seedTargetDir on the PVC. A changed key
    # restarts the broker child inside the existing Pod after an atomic import.
    seedSecretName: ""
    seedTargetDir: codex
  config:
    providers: []
  agents:
    agents: []

operator:
  image:
    repository: ghcr.io/mirkosekulic/nvt-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Optional trusted resolver for dynamic principal-owned broker accounts.
  principalAccounts:
    enabled: false
    brokerURL: https://nvt-broker:7347
    ca:
      existingSecret: ""
      key: ca.crt
    authentication:
      existingSecret: ""
      key: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
    assertionTTLSeconds: 60
    requestTimeoutSeconds: 10
    maxResponseBytes: 65536
    templateSwitching:
      enabled: false
      authentication:
        existingSecret: ""
        key: NVT_DYNAMIC_ACCOUNT_COORDINATION_KEY
      assertionTTLSeconds: 30

gateway:
  enabled: false
  image:
    repository: ghcr.io/mirkosekulic/nvt-agent-gateway
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  baseDomain: agents.localhost
  # In path mode this may be an HTTPS origin or one canonical base path,
  # for example https://staging.altinn.studio/agents (without a trailing slash).
  publicURL: ""
  routing:
    mode: subdomain
  port: 8080
  defaultTargetPort: 4090
  auth:
    mode: none
    session:
      existingSecret: ""
      secretKey: session-secret
      cookieName: nvt_agent_gateway
      cookieDomain: ""
      maxAgeSeconds: 86400
      secure: true
    oidc:
      issuerURL: ""
      clientID: ""
      clientSecret:
        existingSecret: ""
        secretKey: client-secret
      scopes:
        - openid
        - profile
      callbackPath: /oauth2/callback
      clientAuthMethod: ""
      acrValues: ""
      validIssuer: ""
      extraAuthParams: {}
      authorizationDetails: ""
    oauth2:
      credentials:
        existingSecret: ""
        clientIDKey: client-id
        clientSecretKey: client-secret
      callbackPath: /oauth2/callback
      clientAuthMethod: client_secret_post
      issuer: ""
      authorizationURL: ""
      tokenURL: ""
      scopes: []
      clientAuthMethod: client_secret_post
      identity:
        endpoint: ""
        allowedHosts: []
        subjectPath: ""
        displayNamePath: ""
    # Optional. When set, authenticated principals must match one allow rule
    # before a gateway session is created. AgentRun authorization remains a
    # separate second gate.
    admission: null
    # Provider-neutral bounded OAuth claim lookups performed before admission.
    claimEnrichment:
      allowedHosts: []
      timeoutSeconds: 0
      limits: {}
      # Each source may opt into bounded RFC 8288 pagination with:
      # pagination: {mode: link, maxPages: 5}. Paginated valuePath must be $.
      sources: []
    authorization:
      default: deny
      claimSource: id_token
      rules: []
  service:
    type: ClusterIP
    port: 80
  # Optional link only. The gateway does not proxy this service, share its
  # session, inspect enrollment state, or depend on its health.
  credentialPortal:
    url: ""
    label: Manage credentials

# Optional standalone self-service provider login. It patches only pre-created
# seed Secret keys; the broker remains the sole owner of writable canonical
# credentials and refresh. Credential values must never be placed here.
credentialPortal:
  enabled: false
  image:
    repository: ghcr.io/mirkosekulic/nvt-credential-portal
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  publicURL: ""
  port: 8080
  maxUploadBytes: 1048576
  enrollment:
    maxSessions: 64
    maxConcurrent: 2
    timeoutSeconds: 600
    maxOutputBytes: 65536
    # Codex's official device flow may require an account security setting and
    # lacks completed real-account E2E proof for this service.
    experimentalCodexDeviceAuth: false
  # Secondary administrator recovery only. Provider Connect/Reconnect is the
  # normal flow; enabling this exposes bounded raw credential-file upload.
  recoveryUpload:
    enabled: false
  # Optional principal-owned broker mode. When enabled, static slots must be
  # empty and every credential is sent over verified TLS directly to the
  # broker's dynamic principal-account API. Secret values are mounted files,
  # never Helm values or runner environment.
  dynamic:
    enabled: false
    broker:
      url: ""
      ca:
        existingSecret: ""
        key: ca.crt
      authentication:
        existingSecret: ""
        key: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
      assertionTTLSeconds: 60
      # Signed current-eligibility evidence never outlives the portal session.
      # Users renew it by completing a fresh eligible portal login.
      eligibilityLeaseSeconds: 3600
      requestTimeoutSeconds: 10
      maxResponseBytes: 65536
    templateSwitch:
      enabled: false
      # Internal target-free coordinator. No principal, template, provider,
      # profile, or credential is sent on this hop; only an opaque broker ID.
      coordinatorURL: ""
      requestTimeoutSeconds: 10
      maxResponseBytes: 4096
    # Public template name/label -> one compiled trusted enrollment adapter.
    # Provider plugins, ids, profiles, grants, capabilities, and runtime
    # settings remain broker/operator administrator configuration.
    templates: []
  auth:
    mode: oidc
    # Optional shared default-deny eligibility policy. When absent, the portal
    # preserves static admission and requires an exact configured slot owner.
    eligibility: null
    # Optional provider-neutral bounded OAuth claim lookups evaluated only
    # during login. Selected claims and OAuth tokens are not stored in sessions.
    claimEnrichment:
      allowedHosts: []
      timeoutSeconds: 0
      limits: {}
      # Each source may opt into bounded RFC 8288 pagination with:
      # pagination: {mode: link, maxPages: 5}. Paginated valuePath must be $.
      sources: []
    session:
      existingSecret: ""
      secretKey: session-secret
      cookieName: nvt_credential_portal
      maxAgeSeconds: 3600
      secure: true
    oidc:
      issuerURL: ""
      clientID: ""
      # Claims evaluated by auth.eligibility. access_token is accepted only
      # after JWT signature, issuer, and audience verification.
      eligibilityClaimSource: id_token
      # Defaults to clientID when eligibilityClaimSource is access_token.
      accessTokenAudience: ""
      clientSecret:
        existingSecret: ""
        secretKey: client-secret
      scopes:
        - openid
        - profile
      callbackPath: /oauth2/callback
    oauth2:
      credentials:
        existingSecret: ""
        clientIDKey: client-id
        clientSecretKey: client-secret
      issuer: ""
      # Optional RFC 9207 callback `iss` value when it differs from the stable
      # principal issuer namespace above.
      authorizationResponseIssuer: ""
      authorizationURL: ""
      tokenURL: ""
      scopes: []
      callbackPath: /oauth2/callback
      identity:
        endpoint: ""
        allowedHosts: []
        subjectPath: ""
        displayNamePath: ""
  # Every slot binds one exact issuer+subject owner to one adapter and one
  # pre-created broker seed Secret key. Display names are presentation only.
  slots: []
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 512Mi
  networkPolicy:
    enabled: true
    # Kubernetes API, identity-provider, and optional dynamic broker HTTPS
    # destination ports. Add every nonstandard configured HTTPS port explicitly.
    egressTCPPorts:
      - 443

agentSchedule:
  enabled: true
  name: default
  maxParallelism: 1
  # Optional active-run limit applied independently to every exact principal
  # issuer+subject pair, with bounded administrator-owned exceptions.
  principalParallelism: {}
  suspend: false
  # Empty profile fields preserve the legacy full-AgentRun admission contract.
  # See operator/docs/agentschedule.md for a complete profiled example.
  template: {}
  profiles: []
  profileSelection: {}
  # Optional dynamic selection. When enabled, profileSelection must remain
  # empty and every mapped profile uses the reserved $principal-account
  # placeholder for broker/runtime provider references.
  principalCredentialSelection: {}
  # Administrator-owned task guidance and optional lifecycle replacement.
  # A workflow lifecycle replaces (does not merge with) template.lifecycle.
  workflowProfiles: []
  producerPolicies: []
  allowedProducers: []

producer:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/mirkosekulic/nvt-github-comments-producer
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  commandPrefixes:
    - /nvtagent
  allowedAuthors:
    - "*"
  pollInterval: 30s
  operatorCallbackBaseURL: http://nvt-operator:8082
  # Best-effort reactions on authoritative schedule-admission outcomes. The
  # GitHub App needs Issues: write; failures never affect scheduling or cursors.
  schedulingReactions:
    enabled: true
    accepted: "+1"
    rejected: "-1"
  submission:
    mode: scheduleAdmission
    # legacy posts a complete AgentRun. profiled posts only work, prompt, and principal facts.
    admissionMode: legacy
    admissionBaseURL: http://nvt-operator:8082
    admissionTokenFile: /var/run/secrets/nvt-operator/token
    tokenExpirationSeconds: 3600
    scheduleNamespace: ""
    scheduleName: default
    # Optional static workflow profile name for profiled schedule admission.
    workflow: ""
    # Trusted exact routing for producer command intents. New review/run
    # commands are disabled unless explicitly mapped.
    commandWorkflows: {}
  idempotency:
    scope: issue
  repositories: []
  githubApp:
    appID: 0
    installationID: 0
    existingSecret: nvt-github-app
    privateKeyKey: private-key.pem
    privateKeyMountPath: /var/run/secrets/github-app
  state:
    sqlitePath: /var/lib/nvt-github-comments/state.db
  agentRun:
    namespace: ""
    # Empty uses runtime.image from this coordinated chart release.
    runtimeImage: ""
    runtimeType: codex
    runtimeAutonomy: trusted-local
    runtimeClassName: ""
    runtimeAuthSecret: ""
    runtimeAuthMountPath: ""
    workspaceMode: Ephemeral
    # Required when workspaceMode is Persistent.
    workspaceSize: ""
    # Optional dedicated Docker PVC size (1Gi-1Ti); empty uses 20Gi.
    workspaceDockerSize: ""
    # Empty uses the cluster default StorageClass.
    workspaceStorageClassName: ""
    brokerGrants: []
    ttl:
      activeDeadlineSeconds: null
      completedTTLSeconds: 300
      failedTTLSeconds: 3600
      runRetentionSeconds: 2592000
  agentConfig: {}
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true
  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
