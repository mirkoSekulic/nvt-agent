namespace:
  name: ""
  create: false

global:
  # Required when installing this source checkout without component tag
  # overrides. Published OCI packages set Chart.AppVersion to this value.
  imageTag: ""

runtime:
  image:
    repository: ghcr.io/mirkosekulic/nvt-agent-runtime
    tag: ""
    pullPolicy: IfNotPresent

# Optional administrator-owned public branding bundle. The ConfigMap must be
# in the release namespace and contain every fixed key documented in the chart
# README. Empty keeps the coordinated images' built-in NVT Agent branding.
branding:
  existingConfigMap: ""

dind:
  # Include cluster Pod, Service, control-plane, broker, and other protected
  # ranges. Transparent AgentRuns fail closed if any overlaps 172.30.0.0/15.
  protectedCIDRs:
    - 127.0.0.0/8
    - 169.254.0.0/16
  image:
    repository: ghcr.io/mirkosekulic/nvt-dind
    tag: ""
    pullPolicy: IfNotPresent

egress:
  egressd:
    image:
      repository: ghcr.io/mirkosekulic/nvt-egressd
      tag: ""
      pullPolicy: IfNotPresent
  captured:
    image:
      repository: ghcr.io/mirkosekulic/nvt-captured
      tag: ""
      pullPolicy: IfNotPresent
  networkPolicyCapable: false
  allowedTCPPorts:
    - 80
    - 443
  # Additional deployment Pod, Service, node, cluster, and VNet ranges. The
  # operator always adds its built-in IANA non-public and transition ranges.
  denyCIDRs: []
  # Cluster default egress mode for AgentRuns created through the nvt
  # admission/schedule path (producers/schedules) that leave spec.egress
  # empty. Applied once, at creation — flipping it never reclassifies an
  # existing run. Default "direct". A raw `kubectl apply` of an AgentRun with
  # empty egress is defaulted to "direct" by the CRD schema regardless of this
  # knob (docs/transparent-egress-architecture.md).
  defaultMode: direct
  # Opt into the per-grant allowInsecureUpstream escape hatch (plaintext
  # upstream leg). Test/dev only, for hermetic in-cluster fixtures that cannot
  # present a publicly-trusted cert. Leave false in any real deployment: a
  # plaintext upstream carrying an injected credential is a conformance
  # failure, and admission rejects the flag unless this is set.
  allowInsecureUpstreams: false

broker:
  enabled: true
  image:
    repository: ghcr.io/mirkosekulic/nvt-broker
    tag: ""
    pullPolicy: IfNotPresent
  envSecretName: ""
  tls:
    # Serve the broker over TLS. The egressd->broker leg carries real
    # credentials through the agent's network namespace, so mediated
    # production runs require it (protocol/injection.md). When enabled
    # and no existingSecret is given, the chart generates a self-signed CA +
    # serving cert into secretName (preserved across upgrades). The CA cert
    # is public material distributed to egressd and the agent by the operator.
    enabled: true
    secretName: nvt-broker-tls
    existingSecret: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
    existingClaim: ""
    # Optional read-only Kubernetes Secret source. Each top-level key is
    # reconciled independently into seedTargetDir on the PVC. A changed key
    # restarts the broker child inside the existing Pod after an atomic import.
    seedSecretName: ""
    seedTargetDir: codex
  # Provider-neutral native VM guest enrollment is opt-in. It requires the
  # persistent single-writer broker state, TLS, and a dedicated orchestrator
  # bearer token mounted from an existing Secret. The token is never a value.
  guestEnrollment:
    enabled: false
    exchangeURL: ""
    # Aggregate predecessor-digest slots reserved in fixed 20,000-entry
    # lifecycle units. The default admits 100 concurrent enrollment
    # lifecycles; size the persistent volume for the selected bound.
    runtimeIdentityHistoryCapacity: "2000000"
    orchestratorAuth:
      existingSecret: ""
      tokenKey: token
  config:
    providers: []
  agents:
    agents: []

operator:
  image:
    repository: ghcr.io/mirkosekulic/nvt-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1

# Opt-in standalone native-VM egress relay. The relay remains unpublished and
# deny-all until the operator applies a complete exact-binding snapshot. All
# key material comes from existing administrator-owned Secrets.
nativeEgressRelay:
  enabled: false
  # Non-secret administrator-controlled rollout epoch for every externally
  # managed relay TLS/control credential and CA. Increment atomically whenever
  # any referenced Secret material rotates so relay and operator restart
  # together instead of loading incompatible generations.
  rolloutRevision: ""
  image:
    repository: ghcr.io/mirkosekulic/nvt-native-egress-relay
    tag: ""
    pullPolicy: IfNotPresent
  initImage:
    repository: docker.io/library/busybox
    # This root init container handles every relay private key and control
    # bearer. Keep its multi-architecture image immutable; enabled installs
    # reject missing or non-canonical digests, including administrator
    # overrides.
    digest: sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    pullPolicy: IfNotPresent
  replicas: 1
  data:
    port: 7445
    # Source ranges permitted to reach the guest-facing listener. Empty keeps
    # the data listener fenced until provider routing is configured.
    ingressCIDRs: []
  attachment:
    # Monotonic installation-owned attachment generation. Increment whenever
    # relay identity/trust, required bootstrap/control destinations, or
    # redirect intent changes.
    generation: 1
    relayHost: ""
    relayServerName: ""
    # Complete provider bootstrap allowlist. Each entry has purpose
    # "bootstrap" or "control", one canonical DNS/IP host, and one port.
    requiredDestinations: []
    redirect:
      mode: capture-tcp
      loopbackAddress: 127.0.0.1
      transparentTCPPort: 15001
      explicitCONNECTPort: 15002
  control:
    port: 7446
    serverName: ""
    timeoutSeconds: 10
  brokerURL: ""
  brokerServerName: ""
  authenticationTimeoutSeconds: 5
  revalidationIntervalSeconds: 30
  credentials:
    existingSecret: ""
    dataCertificateKey: data-tls.crt
    dataPrivateKeyKey: data-tls.key
    # Public CA trust for the data listener. This is the only relay Secret
    # item projected into the operator attachment-plan volume.
    dataCAKey: data-ca.crt
    controlCAKey: control-ca.crt
    controlCertificateKey: control-tls.crt
    controlPrivateKeyKey: control-tls.key
    controlTokenKey: control-token
  brokerCA:
    existingSecret: ""
    key: ca.crt

# Administrator-owned external execution-driver registrations. Each entry
# creates one isolated host workload. AgentRuns select only the exact matching
# logical name; empty preserves the built-in Kubernetes-only deployment.
executionDrivers:
  hostImage:
    repository: ghcr.io/mirkosekulic/nvt-execution-driver-host
    tag: ""
    pullPolicy: IfNotPresent
  # Optional trusted bridge from the operator to the broker issuer and the
  # exact selected external driver host. Secret values are projected from
  # existing Secrets and never enter this values document. The broker and
  # operator load the bearer once; rotate it by restarting both Deployments.
  guestEnrollment:
    enabled: false
    # Exact external VM driver registrations whose host accepts the sensitive
    # enrollment handoff. Other registrations retain the ordinary protocol.
    registrations: []
    brokerURL: ""
    serverName: ""
    ca:
      existingSecret: ""
      key: ca.crt
    orchestratorAuth:
      existingSecret: ""
      tokenKey: token
    requestTimeoutSeconds: 30
    handoffTimeoutSeconds: 30
    ttlSeconds: 300
  # Each registration may opt into one isolated persistent filesystem at
  # /var/lib/nvt-execution-driver. Omitted storage preserves the existing
  # ephemeral host shape. A registration may request a chart-owned claim or
  # name one existing same-namespace claim; it cannot configure both.
  registrations: []

gateway:
  enabled: false
  image:
    repository: ghcr.io/mirkosekulic/nvt-agent-gateway
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  baseDomain: agents.localhost
  # In path mode this may be an HTTPS origin or one canonical base path,
  # for example https://staging.altinn.studio/agents (without a trailing slash).
  publicURL: ""
  routing:
    mode: subdomain
  port: 8080
  defaultTargetPort: 4090
  # Opt-in provider-neutral native VM guest session listener. The separate TLS
  # port accepts only broker-authenticated nvt.native-session/v1 connections;
  # it does not publish browser/code-server routes.
  nativeSession:
    enabled: false
    port: 7443
    tls:
      existingSecret: ""
      certificateKey: tls.crt
      privateKeyKey: tls.key
    brokerURL: ""
    serverName: ""
    ca:
      existingSecret: ""
      key: ca.crt
    authenticationTimeoutSeconds: 5
    # Established connections are closed and must reauthenticate through the
    # broker at this bound. The gateway never retains the session bearer.
    revalidationIntervalSeconds: 30
  # Optional, separate nvt.native-workspace/v1 TLS/yamux data plane. It reuses
  # the nativeSession serving identity and broker authority. No browser route
  # is published by enabling this listener.
  nativeWorkspace:
    enabled: false
    port: 7444
  auth:
    mode: none
    session:
      existingSecret: ""
      secretKey: session-secret
      cookieName: nvt_agent_gateway
      cookieDomain: ""
      maxAgeSeconds: 86400
      secure: true
    oidc:
      issuerURL: ""
      clientID: ""
      clientSecret:
        existingSecret: ""
        secretKey: client-secret
      scopes:
        - openid
        - profile
      callbackPath: /oauth2/callback
      clientAuthMethod: ""
      acrValues: ""
      validIssuer: ""
      extraAuthParams: {}
      authorizationDetails: ""
    oauth2:
      credentials:
        existingSecret: ""
        clientIDKey: client-id
        clientSecretKey: client-secret
      callbackPath: /oauth2/callback
      clientAuthMethod: client_secret_post
      issuer: ""
      authorizationURL: ""
      tokenURL: ""
      scopes: []
      clientAuthMethod: client_secret_post
      identity:
        endpoint: ""
        allowedHosts: []
        subjectPath: ""
        displayNamePath: ""
    # Optional. When set, authenticated principals must match one allow rule
    # before a gateway session is created. AgentRun authorization remains a
    # separate second gate.
    admission: null
    # Provider-neutral bounded OAuth claim lookups performed before admission.
    claimEnrichment:
      allowedHosts: []
      sources: []
    authorization:
      default: deny
      claimSource: id_token
      rules: []
  service:
    type: ClusterIP
    port: 80
  # Optional link only. The gateway does not proxy this service, share its
  # session, inspect enrollment state, or depend on its health.
  credentialPortal:
    url: ""
    label: Manage credentials

# Optional standalone self-service provider login. It patches only pre-created
# seed Secret keys; the broker remains the sole owner of writable canonical
# credentials and refresh. Credential values must never be placed here.
credentialPortal:
  enabled: false
  image:
    repository: ghcr.io/mirkosekulic/nvt-credential-portal
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  publicURL: ""
  port: 8080
  maxUploadBytes: 1048576
  enrollment:
    maxSessions: 64
    maxConcurrent: 2
    timeoutSeconds: 600
    maxOutputBytes: 65536
    # Codex's official device flow may require an account security setting and
    # lacks completed real-account E2E proof for this service.
    experimentalCodexDeviceAuth: false
  # Secondary administrator recovery only. Provider Connect/Reconnect is the
  # normal flow; enabling this exposes bounded raw credential-file upload.
  recoveryUpload:
    enabled: false
  auth:
    mode: oidc
    session:
      existingSecret: ""
      secretKey: session-secret
      cookieName: nvt_credential_portal
      maxAgeSeconds: 3600
      secure: true
    oidc:
      issuerURL: ""
      clientID: ""
      clientSecret:
        existingSecret: ""
        secretKey: client-secret
      scopes:
        - openid
        - profile
      callbackPath: /oauth2/callback
    oauth2:
      credentials:
        existingSecret: ""
        clientIDKey: client-id
        clientSecretKey: client-secret
      issuer: ""
      authorizationURL: ""
      tokenURL: ""
      scopes: []
      callbackPath: /oauth2/callback
      identity:
        endpoint: ""
        allowedHosts: []
        subjectPath: ""
        displayNamePath: ""
  # Every slot binds one exact issuer+subject owner to one adapter and one
  # pre-created broker seed Secret key. Display names are presentation only.
  slots: []
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 512Mi
  networkPolicy:
    enabled: true
    # Kubernetes API and identity-provider HTTPS destination ports. Add a
    # nonstandard configured HTTPS port explicitly.
    egressTCPPorts:
      - 443

agentSchedule:
  enabled: true
  name: default
  maxParallelism: 1
  suspend: false
  # Empty profile fields preserve the legacy full-AgentRun admission contract.
  # See operator/docs/agentschedule.md for a complete profiled example.
  template: {}
  # Administrator-owned opaque configurations for explicitly selected
  # execution drivers. Empty keeps the built-in Kubernetes Pod path only.
  executionClasses: []
  profiles: []
  profileSelection: {}
  workflowProfiles: []
  producerPolicies: []
  allowedProducers: []

producer:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/mirkosekulic/nvt-github-comments-producer
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  commandPrefixes:
    - /nvtagent
  allowedAuthors:
    - "*"
  pollInterval: 30s
  operatorCallbackBaseURL: http://nvt-operator:8082
  submission:
    mode: scheduleAdmission
    # legacy posts a complete AgentRun. profiled posts only work, prompt, and principal facts.
    admissionMode: legacy
    admissionBaseURL: http://nvt-operator:8082
    admissionTokenFile: /var/run/secrets/nvt-operator/token
    tokenExpirationSeconds: 3600
    scheduleNamespace: ""
    scheduleName: default
    # Optional static workflow profile name for profiled schedule admission.
    workflow: ""
  idempotency:
    scope: issue
  repositories: []
  githubApp:
    appID: 0
    installationID: 0
    existingSecret: nvt-github-app
    privateKeyKey: private-key.pem
    privateKeyMountPath: /var/run/secrets/github-app
  state:
    sqlitePath: /var/lib/nvt-github-comments/state.db
  agentRun:
    namespace: ""
    # Empty uses runtime.image from this coordinated chart release.
    runtimeImage: ""
    runtimeType: codex
    runtimeAutonomy: trusted-local
    runtimeClassName: ""
    runtimeAuthSecret: ""
    runtimeAuthMountPath: ""
    workspaceMode: Ephemeral
    # Required when workspaceMode is Persistent.
    workspaceSize: ""
    # Optional dedicated Docker PVC size (1Gi-1Ti); empty uses 20Gi.
    workspaceDockerSize: ""
    # Empty uses the cluster default StorageClass.
    workspaceStorageClassName: ""
    brokerGrants: []
    ttl:
      activeDeadlineSeconds: null
      completedTTLSeconds: 300
      failedTTLSeconds: 3600
      runRetentionSeconds: 2592000
  agentConfig: {}
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true
  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
