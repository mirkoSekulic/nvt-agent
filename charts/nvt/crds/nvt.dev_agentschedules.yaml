apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentschedules.nvt.dev
spec:
  group: nvt.dev
  names:
    kind: AgentSchedule
    listKind: AgentScheduleList
    plural: agentschedules
    singular: agentschedule
    shortNames:
      - asched
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: AgentSchedule represents a generic admission pool for disposable AgentRuns.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!(has(self.workflowProfiles) || has(self.producerPolicies)) || (!has(self.allowedProducers) && has(self.workflowProfiles) && has(self.producerPolicies))"
                  message: workflow-enabled schedules require workflowProfiles and producerPolicies and cannot use legacy allowedProducers
                - rule: "!has(self.principalCredentialSelection) || !self.principalCredentialSelection.enabled || !has(self.profileSelection)"
                  message: dynamic principal credential selection cannot use static profileSelection
                - rule: "!has(self.principalCredentialSelection) || !self.principalCredentialSelection.enabled || has(self.producerPolicies)"
                  message: dynamic principal credential selection requires producerPolicies
                - rule: "!has(self.principalCredentialSelection) || !self.principalCredentialSelection.enabled || self.producerPolicies.all(p, has(p.allowedPrincipalIssuers) && size(p.allowedPrincipalIssuers) > 0)"
                  message: dynamic principal credential selection requires issuer eligibility on every producer policy
                - rule: "!has(self.principalParallelism) || (has(self.profiles) && size(self.profiles) > 0)"
                  message: principalParallelism requires a profiled schedule
              properties:
                suspend:
                  type: boolean
                maxParallelism:
                  type: integer
                  minimum: 0
                principalParallelism:
                  description: Per-principal active-run capacity with exact issuer and subject overrides.
                  type: object
                  required:
                    - defaultMaxParallelism
                  properties:
                    defaultMaxParallelism:
                      type: integer
                      minimum: 1
                    overrides:
                      type: array
                      maxItems: 256
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - issuer
                        - subject
                      items:
                        type: object
                        required:
                          - issuer
                          - subject
                          - maxParallelism
                        properties:
                          issuer:
                            type: string
                            minLength: 1
                            maxLength: 2048
                          subject:
                            type: string
                            minLength: 1
                            maxLength: 512
                          maxParallelism:
                            type: integer
                            minimum: 1
                allowedProducers:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                workflowProfiles:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      workspaceInstructions:
                        type: string
                        maxLength: 65536
                      lifecycle:
                        type: object
                        x-kubernetes-validations:
                          - rule: "!has(self.completeOn) || !has(self.failOn) || self.completeOn.all(e, !(e in self.failOn))"
                            message: lifecycle completeOn and failOn events must not overlap
                        properties:
                          completeOn:
                            type: array
                            maxItems: 128
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              minLength: 1
                              maxLength: 256
                              pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
                          failOn:
                            type: array
                            maxItems: 128
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              minLength: 1
                              maxLength: 256
                              pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
                producerPolicies:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - identity
                    properties:
                      identity:
                        type: string
                        minLength: 1
                      workflows:
                        type: array
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      defaultWorkflow:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      allowedPrincipalIssuers:
                        type: array
                        maxItems: 32
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          minLength: 1
                          maxLength: 2048
                executionClasses:
                  description: Administrator-owned opaque execution-driver configurations.
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - kind
                      - driver
                      - configuration
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      kind:
                        type: string
                        enum:
                          - pod
                          - vm
                      driver:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      configuration:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                template:
                  type: object
                  required:
                    - image
                    - workspace
                    - agent
                  properties:
                    image:
                      type: string
                      minLength: 1
                    runtimeClassName:
                      type: string
                    resources:
                      description: Resources is snapshotted into the generated AgentRun and applied to its agent container.
                      type: object
                      properties:
                        claims:
                          type: array
                          x-kubernetes-list-map-keys:
                            - name
                          x-kubernetes-list-type: map
                          items:
                            type: object
                            required:
                              - name
                            properties:
                              name:
                                type: string
                        limits:
                          type: object
                          additionalProperties:
                            anyOf:
                              - type: integer
                              - type: string
                            pattern: '^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([eE](\\+|-)?[0-9]+)|[numkKMGTPCE]i?)?$'
                            x-kubernetes-int-or-string: true
                        requests:
                          type: object
                          additionalProperties:
                            anyOf:
                              - type: integer
                              - type: string
                            pattern: '^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([eE](\\+|-)?[0-9]+)|[numkKMGTPCE]i?)?$'
                            x-kubernetes-int-or-string: true
                    tolerations:
                      type: array
                      items:
                        type: object
                        properties:
                          effect:
                            type: string
                          key:
                            type: string
                          operator:
                            type: string
                          tolerationSeconds:
                            type: integer
                            format: int64
                          value:
                            type: string
                    workspace:
                      type: object
                      x-kubernetes-validations:
                        - rule: "self.mode == 'Persistent' ? has(self.size) : !has(self.size) && !has(self.dockerSize) && !has(self.storageClassName)"
                          message: size is required for Persistent mode and size/dockerSize/storageClassName are forbidden for Ephemeral mode
                        - rule: "!has(self.size) || quantity(string(self.size)).isGreaterThan(quantity('0'))"
                          message: size must be a positive Kubernetes resource quantity
                        - rule: "!has(self.dockerSize) || !quantity('1Gi').isGreaterThan(quantity(string(self.dockerSize)))"
                          message: dockerSize must be at least 1Gi
                        - rule: "!has(self.dockerSize) || !quantity(string(self.dockerSize)).isGreaterThan(quantity('1Ti'))"
                          message: dockerSize must be at most 1Ti
                      properties:
                        mode:
                          type: string
                          default: Ephemeral
                          enum:
                            - Ephemeral
                            - Persistent
                        size:
                          anyOf:
                            - type: integer
                            - type: string
                          pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([eE](\+|-)?[0-9]+)|[numkKMGTPCE]i?)?$'
                          x-kubernetes-int-or-string: true
                        dockerSize:
                          anyOf:
                            - type: integer
                            - type: string
                          pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([eE](\+|-)?[0-9]+)|[numkKMGTPCE]i?)?$'
                          x-kubernetes-int-or-string: true
                        storageClassName:
                          type: string
                          maxLength: 253
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    agent:
                      type: object
                      required:
                        - config
                      properties:
                        config:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        workspaceInstructions:
                          type: string
                          maxLength: 65536
                    lifecycle:
                      type: object
                      properties:
                        completeOn:
                          type: array
                          items:
                            type: string
                            minLength: 1
                        failOn:
                          type: array
                          items:
                            type: string
                            minLength: 1
                    ttl:
                      type: object
                      properties:
                        activeDeadlineSeconds:
                          type: integer
                          minimum: 0
                        completedTTLSeconds:
                          type: integer
                          minimum: 0
                        failedTTLSeconds:
                          type: integer
                          minimum: 0
                        runRetentionSeconds:
                          type: integer
                          minimum: 0
                profiles:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    x-kubernetes-validations:
                      - rule: "!has(self.egressForwardProxy)"
                        message: egressForwardProxy is removed; use egressTransport
                      - rule: "!has(self.egressMaxConcurrentTunnels) || (has(self.egressTransport) && self.egressTransport in ['forward-proxy', 'transparent'])"
                        message: egressMaxConcurrentTunnels requires egressTransport forward-proxy or transparent
                    required:
                      - name
                      - runtime
                      - agentRuntimeConfig
                      - egress
                    properties:
                      name:
                        type: string
                        minLength: 1
                      runtime:
                        type: object
                        x-kubernetes-validations:
                          - rule: "!has(self.effort) || self.type != 'codex' || self.effort in ['minimal', 'low', 'medium', 'high', 'xhigh']"
                            message: codex effort must be minimal, low, medium, high, or xhigh
                          - rule: "!has(self.effort) || self.type != 'claude' || self.effort in ['low', 'medium', 'high', 'xhigh', 'max']"
                            message: claude effort must be low, medium, high, xhigh, or max
                        required:
                          - type
                          - autonomy
                        properties:
                          type:
                            type: string
                            enum:
                              - codex
                              - claude
                          autonomy:
                            type: string
                            enum:
                              - trusted-local
                              - interactive
                          model:
                            type: string
                            minLength: 1
                            maxLength: 256
                          effort:
                            type: string
                            enum:
                              - minimal
                              - low
                              - medium
                              - high
                              - xhigh
                              - max
                          user:
                            type: string
                            default: root
                            enum:
                              - root
                              - non-root
                          container:
                            type: object
                            properties:
                              capabilities:
                                type: object
                                properties:
                                  add:
                                    type: array
                                    x-kubernetes-list-type: set
                                    items:
                                      type: string
                                      enum:
                                        - CHOWN
                                        - DAC_OVERRIDE
                                        - DAC_READ_SEARCH
                                        - FOWNER
                                        - FSETID
                                        - KILL
                                        - SETGID
                                        - SETUID
                                        - SETPCAP
                                        - LINUX_IMMUTABLE
                                        - NET_BIND_SERVICE
                                        - NET_BROADCAST
                                        - NET_ADMIN
                                        - NET_RAW
                                        - IPC_LOCK
                                        - IPC_OWNER
                                        - SYS_MODULE
                                        - SYS_RAWIO
                                        - SYS_CHROOT
                                        - SYS_PTRACE
                                        - SYS_PACCT
                                        - SYS_ADMIN
                                        - SYS_BOOT
                                        - SYS_NICE
                                        - SYS_RESOURCE
                                        - SYS_TIME
                                        - SYS_TTY_CONFIG
                                        - MKNOD
                                        - LEASE
                                        - AUDIT_WRITE
                                        - AUDIT_CONTROL
                                        - SETFCAP
                                        - MAC_OVERRIDE
                                        - MAC_ADMIN
                                        - SYSLOG
                                        - WAKE_ALARM
                                        - BLOCK_SUSPEND
                                        - AUDIT_READ
                                        - PERFMON
                                        - BPF
                                        - CHECKPOINT_RESTORE
                          docker:
                            type: object
                            properties:
                              kernelLogDevice:
                                type: boolean
                              requiredNetworks:
                                type: array
                                maxItems: 16
                                x-kubernetes-list-type: map
                                x-kubernetes-list-map-keys:
                                  - name
                                items:
                                  type: object
                                  required:
                                    - name
                                    - subnet
                                  properties:
                                    name:
                                      type: string
                                      maxLength: 63
                                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                                    subnet:
                                      type: string
                                      pattern: '^172\.31\.[0-9]{1,3}\.0/24$'
                      runtimeAuth:
                        type: object
                        required:
                          - secretName
                        properties:
                          secretName:
                            type: string
                            minLength: 1
                          mountPath:
                            type: string
                            minLength: 1
                      agentRuntimeConfig:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      execution:
                        description: Operator-owned execution selection. Omitted means the built-in Kubernetes Pod backend.
                        type: object
                        required:
                          - kind
                          - driver
                        properties:
                          kind:
                            type: string
                            enum:
                              - pod
                              - vm
                          driver:
                            type: string
                            minLength: 1
                            maxLength: 63
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                          classRef:
                            type: string
                            minLength: 1
                            maxLength: 63
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      workspaceInstructions:
                        type: string
                        maxLength: 65536
                      egress:
                        type: string
                        enum:
                          - direct
                          - mediated
                      egressAllowInsecureBroker:
                        type: boolean
                        default: false
                      egressEnforcement:
                        type: boolean
                        default: false
                      egressForwardProxy:
                        type: boolean
                        description: 'Deprecated: migration tombstone; any presence is rejected. Use egressTransport.'
                      egressTransport:
                        type: string
                        enum:
                          - redirect
                          - forward-proxy
                          - transparent
                      egressMaxConcurrentTunnels:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 4096
                      broker:
                        type: object
                        properties:
                          grants:
                            type: array
                            items:
                              type: object
                              required:
                                - provider
                                - repositories
                              properties:
                                provider:
                                  type: string
                                  minLength: 1
                                repositories:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                preparations:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - operation
                                    properties:
                                      operation:
                                        type: string
                                        enum:
                                          - identity
                                materialization:
                                  type: string
                                  default: file-bundle
                                  enum:
                                    - file-bundle
                                    - header-inject
                                    - placeholder-file
                                egressHosts:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 1
                                git:
                                  type: boolean
                                  default: false
                                allowInsecureUpstream:
                                  type: boolean
                                  default: false
                                permissions:
                                  type: object
                                  additionalProperties:
                                    type: string
                                    enum:
                                      - read
                                      - write
                                quota:
                                  type: object
                                  required:
                                    - requests
                                  properties:
                                    requests:
                                      type: integer
                                      minimum: 1
                profileSelection:
                  type: object
                  required:
                    - onNoMatch
                  properties:
                    defaultProfile:
                      type: string
                      minLength: 1
                    onNoMatch:
                      type: string
                      enum:
                        - useDefault
                        - deny
                    rules:
                      type: array
                      items:
                        type: object
                        required:
                          - issuer
                          - subject
                          - profile
                        properties:
                          issuer:
                            type: string
                            minLength: 1
                          subject:
                            type: string
                            minLength: 1
                          profile:
                            type: string
                            minLength: 1
                principalCredentialSelection:
                  type: object
                  required:
                    - enabled
                    - onNoMatch
                    - templateProfiles
                  properties:
                    enabled:
                      type: boolean
                    onNoMatch:
                      type: string
                      enum:
                        - deny
                    templateProfiles:
                      type: array
                      minItems: 1
                      maxItems: 64
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - template
                      items:
                        type: object
                        required:
                          - template
                          - profile
                        properties:
                          template:
                            type: string
                            minLength: 1
                            maxLength: 63
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                          profile:
                            type: string
                            minLength: 1
                            maxLength: 63
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                activeRuns:
                  type: integer
                  minimum: 0
                lastAcceptedAt:
                  type: string
                  format: date-time
                lastRejectedAt:
                  type: string
                  format: date-time
                lastRejectionReason:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Active
          type: integer
          jsonPath: .status.activeRuns
        - name: Max
          type: integer
          jsonPath: .spec.maxParallelism
        - name: Suspended
          type: boolean
          jsonPath: .spec.suspend
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
