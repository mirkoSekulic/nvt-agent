{{- if .Values.credentialPortal.enabled }}
{{- $portal := .Values.credentialPortal }}
{{- $fullname := printf "%s-credential-portal" (include "nvt.fullname" .) }}
{{- if ne (int $portal.replicas) 1 }}{{ fail "credentialPortal.replicas must be exactly 1 because sessions are process-local" }}{{ end }}
{{- if ne $portal.service.type "ClusterIP" }}{{ fail "credentialPortal.service.type must be ClusterIP behind an HTTPS ingress" }}{{ end }}
{{- if not $portal.networkPolicy.enabled }}{{ fail "credentialPortal.networkPolicy.enabled must remain true" }}{{ end }}
{{- if eq (len $portal.networkPolicy.egressTCPPorts) 0 }}{{ fail "credentialPortal.networkPolicy.egressTCPPorts must not be empty" }}{{ end }}
{{- range $port := $portal.networkPolicy.egressTCPPorts }}{{ if or (lt (int $port) 1) (gt (int $port) 65535) }}{{ fail "credentialPortal.networkPolicy.egressTCPPorts contains an invalid port" }}{{ end }}{{ end }}
{{- if or (not .Values.broker.enabled) (not .Values.broker.persistence.enabled) (not .Values.broker.persistence.seedSecretName) }}{{ fail "credentialPortal requires the broker persistent seed supervisor and broker.persistence.seedSecretName" }}{{ end }}
{{- if or (not (regexMatch `^https://[^/@?#]+(?::[0-9]+)?(?:/|/[A-Za-z0-9._~-]+(?:/[A-Za-z0-9._~-]+)*)?$` $portal.publicURL)) (hasSuffix "/" $portal.publicURL) }}{{ fail "credentialPortal.publicURL must be a canonical absolute HTTPS URL without a trailing slash" }}{{ end }}
{{- if or (lt (int $portal.port) 1) (gt (int $portal.port) 65535) (lt (int $portal.service.port) 1) (gt (int $portal.service.port) 65535) }}{{ fail "credentialPortal ports must be between 1 and 65535" }}{{ end }}
{{- if or (lt (int64 $portal.maxUploadBytes) 1024) (gt (int64 $portal.maxUploadBytes) 1048576) }}{{ fail "credentialPortal.maxUploadBytes must be between 1024 and 1048576" }}{{ end }}
{{- if not (has $portal.auth.mode (list "oidc" "oauth2")) }}{{ fail "credentialPortal.auth.mode must be oidc or oauth2" }}{{ end }}
{{- range $method := list $portal.auth.oidc.clientAuthMethod $portal.auth.oauth2.clientAuthMethod }}{{ if and $method (not (has $method (list "client_secret_basic" "client_secret_post"))) }}{{ fail "credentialPortal clientAuthMethod must be client_secret_basic or client_secret_post" }}{{ end }}{{ end }}
{{- if or (not $portal.auth.session.existingSecret) (not $portal.auth.session.secure) (lt (int $portal.auth.session.maxAgeSeconds) 300) (gt (int $portal.auth.session.maxAgeSeconds) 86400) }}{{ fail "credentialPortal auth requires a secure existing session Secret and a 300..86400 second lifetime" }}{{ end }}
{{- if not (regexMatch `^[A-Za-z0-9_-]{1,64}$` $portal.auth.session.cookieName) }}{{ fail "credentialPortal.auth.session.cookieName is invalid" }}{{ end }}
{{- range $name := list $portal.auth.session.existingSecret $portal.auth.oidc.clientSecret.existingSecret $portal.auth.oauth2.credentials.existingSecret }}{{ if and $name (or (gt (len $name) 253) (not (regexMatch `^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$` $name))) }}{{ fail "credentialPortal existing Secret references must be valid Kubernetes names" }}{{ end }}{{ end }}
{{- range $key := list $portal.auth.session.secretKey $portal.auth.oidc.clientSecret.secretKey $portal.auth.oauth2.credentials.clientIDKey $portal.auth.oauth2.credentials.clientSecretKey }}{{ if or (not $key) (gt (len $key) 253) (not (regexMatch `^[A-Za-z0-9._-]+$` $key)) }}{{ fail "credentialPortal Secret keys are invalid" }}{{ end }}{{ end }}
{{- $callback := $portal.auth.oidc.callbackPath }}{{ if eq $portal.auth.mode "oauth2" }}{{ $callback = $portal.auth.oauth2.callbackPath }}{{ end }}
{{- if or (not (hasPrefix "/oauth2/" $callback)) (ne (clean $callback) $callback) (contains "%" $callback) (contains "?" $callback) (contains "#" $callback) }}{{ fail "credentialPortal authentication callbackPath must be an unambiguous path below /oauth2/" }}{{ end }}
{{- if eq $portal.auth.mode "oidc" }}
{{- if or (not $portal.auth.oidc.issuerURL) (not $portal.auth.oidc.clientID) (not $portal.auth.oidc.clientSecret.existingSecret) }}{{ fail "credentialPortal OIDC issuerURL, clientID, and clientSecret.existingSecret are required" }}{{ end }}
{{- else }}
{{- if or (not $portal.auth.oauth2.credentials.existingSecret) (not $portal.auth.oauth2.issuer) (not $portal.auth.oauth2.authorizationURL) (not $portal.auth.oauth2.tokenURL) (not $portal.auth.oauth2.identity.endpoint) (not $portal.auth.oauth2.identity.subjectPath) (eq (len $portal.auth.oauth2.identity.allowedHosts) 0) }}{{ fail "credentialPortal OAuth2 credentials, issuer, endpoints, allowed identity hosts, and subjectPath are required" }}{{ end }}
{{- end }}
{{- if or (eq (len $portal.slots) 0) (gt (len $portal.slots) 128) }}{{ fail "credentialPortal.slots must contain 1..128 entries" }}{{ end }}
{{- $seenSlots := dict }}{{- $secretNames := list }}
{{- range $index, $slot := $portal.slots }}
{{- if or (not (regexMatch `^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$` $slot.name)) (gt (len $slot.name) 63) (hasKey $seenSlots $slot.name) }}{{ fail (printf "credentialPortal.slots[%d].name must be a unique DNS label" $index) }}{{ end }}{{- $_ := set $seenSlots $slot.name true }}
{{- if or (not $slot.label) (not $slot.owner.issuer) (not $slot.owner.subject) }}{{ fail (printf "credentialPortal slot %s requires label and exact owner issuer/subject" $slot.name) }}{{ end }}
{{- if not (has $slot.adapter (list "codex-oauth-file" "claude-oauth-file")) }}{{ fail (printf "credentialPortal slot %s adapter is unsupported" $slot.name) }}{{ end }}
{{- if or (not $slot.brokerProvider) (ne $slot.secretName $.Values.broker.persistence.seedSecretName) }}{{ fail (printf "credentialPortal slot %s must identify a broker provider and target broker.persistence.seedSecretName" $slot.name) }}{{ end }}
{{- if not (regexMatch `^[A-Za-z0-9._-]{1,253}$` $slot.dataKey) }}{{ fail (printf "credentialPortal slot %s dataKey is invalid" $slot.name) }}{{ end }}
{{- $secretNames = append $secretNames $slot.secretName }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-portal
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range ($secretNames | uniq | sortAlpha) }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ include "nvt.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
data:
  config.json: |
    {{- $auth := dict "mode" $portal.auth.mode "session" (dict "cookieName" $portal.auth.session.cookieName "maxAgeSeconds" $portal.auth.session.maxAgeSeconds "secure" true) "oidc" (dict "issuerURL" $portal.auth.oidc.issuerURL "clientID" $portal.auth.oidc.clientID "scopes" $portal.auth.oidc.scopes "callbackPath" $portal.auth.oidc.callbackPath "clientAuthMethod" $portal.auth.oidc.clientAuthMethod) "oauth2" (dict "issuer" $portal.auth.oauth2.issuer "authorizationURL" $portal.auth.oauth2.authorizationURL "tokenURL" $portal.auth.oauth2.tokenURL "scopes" $portal.auth.oauth2.scopes "callbackPath" $portal.auth.oauth2.callbackPath "identityEndpoint" $portal.auth.oauth2.identity.endpoint "allowedHosts" $portal.auth.oauth2.identity.allowedHosts "subjectPath" $portal.auth.oauth2.identity.subjectPath "displayNamePath" $portal.auth.oauth2.identity.displayNamePath "clientAuthMethod" $portal.auth.oauth2.clientAuthMethod) }}
    {{- dict "publicURL" $portal.publicURL "listenAddr" (printf ":%v" $portal.port) "namespace" (include "nvt.namespace" .) "maxUploadBytes" $portal.maxUploadBytes "auth" $auth "slots" $portal.slots | toPrettyJson | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nvt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: credential-portal
  template:
    metadata:
      labels:
        {{- include "nvt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credential-portal
      annotations:
        checksum/config: {{ dict "auth" $portal.auth "slots" $portal.slots "publicURL" $portal.publicURL | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: credential-portal
          image: {{ include "nvt.image" (dict "root" . "name" "credentialPortal.image" "image" $portal.image) | quote }}
          imagePullPolicy: {{ $portal.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - name: http
              containerPort: {{ $portal.port }}
          env:
            - name: NVT_CREDENTIAL_PORTAL_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ $portal.auth.session.existingSecret | quote }}, key: {{ $portal.auth.session.secretKey | quote }}}}
            {{- if eq $portal.auth.mode "oidc" }}
            - name: NVT_CREDENTIAL_PORTAL_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $portal.auth.oidc.clientSecret.existingSecret | quote }}, key: {{ $portal.auth.oidc.clientSecret.secretKey | quote }}}}
            {{- else }}
            - name: NVT_CREDENTIAL_PORTAL_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ $portal.auth.oauth2.credentials.existingSecret | quote }}, key: {{ $portal.auth.oauth2.credentials.clientIDKey | quote }}}}
            - name: NVT_CREDENTIAL_PORTAL_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $portal.auth.oauth2.credentials.existingSecret | quote }}, key: {{ $portal.auth.oauth2.credentials.clientSecretKey | quote }}}}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nvt-credential-portal
              readOnly: true
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          resources:
            {{- toYaml $portal.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: {{ $fullname }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
spec:
  type: {{ $portal.service.type }}
  selector:
    {{- include "nvt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: credential-portal
  ports:
    - name: http
      port: {{ $portal.service.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  namespace: {{ include "nvt.namespace" . }}
  labels:
    {{- include "nvt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nvt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: credential-portal
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: {{ $portal.port }}}]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        {{- range $portal.networkPolicy.egressTCPPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
