{{- $brandingConfigMap := include "nvt.brandingConfigMap" . -}}
{{- $principalAccounts := .Values.operator.principalAccounts -}}
{{- $principalAccountsEnabled := default false $principalAccounts.enabled -}}
{{- if $principalAccountsEnabled -}}
{{- if or (not .Values.broker.enabled) (not .Values.broker.persistence.enabled) (not .Values.broker.tls.enabled) }}{{ fail "operator.principalAccounts requires the persistent TLS broker" }}{{ end -}}
{{- if or (not (regexMatch `^https://[^/@?#[:space:]\\]+(?::[0-9]+)?$` $principalAccounts.brokerURL)) (hasSuffix "/" $principalAccounts.brokerURL) }}{{ fail "operator.principalAccounts.brokerURL must be an HTTPS origin without a path" }}{{ end -}}
{{- range $name := list $principalAccounts.ca.existingSecret $principalAccounts.authentication.existingSecret }}{{ if or (not $name) (gt (len $name) 253) (not (regexMatch `^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$` $name)) }}{{ fail "operator.principalAccounts Secret references must be valid Kubernetes names" }}{{ end }}{{ end -}}
{{- range $key := list $principalAccounts.ca.key $principalAccounts.authentication.key }}{{ if or (not $key) (gt (len $key) 253) (not (regexMatch `^[A-Za-z0-9._-]+$` $key)) }}{{ fail "operator.principalAccounts Secret keys are invalid" }}{{ end }}{{ end -}}
{{- if or (lt (int $principalAccounts.assertionTTLSeconds) 1) (gt (int $principalAccounts.assertionTTLSeconds) 900) (lt (int $principalAccounts.requestTimeoutSeconds) 1) (gt (int $principalAccounts.requestTimeoutSeconds) 30) (lt (int64 $principalAccounts.maxResponseBytes) 1024) (gt (int64 $principalAccounts.maxResponseBytes) 65536) }}{{ fail "operator.principalAccounts bounds are invalid" }}{{ end -}}
{{- if not (regexMatch `^[A-Za-z0-9._-]{1,128}$` .Values.broker.dynamicAccountAssertionRotationEpoch) }}{{ fail "operator.principalAccounts requires broker.dynamicAccountAssertionRotationEpoch as a bounded non-secret rotation identifier" }}{{ end -}}
{{- $dynamicAccounts := index .Values.broker.config "dynamic-accounts" -}}
{{- if or (not (kindIs "map" $dynamicAccounts)) (not (eq true (index $dynamicAccounts "enabled"))) }}{{ fail "operator.principalAccounts requires broker.config.dynamic-accounts.enabled=true" }}{{ end -}}
{{- $brokerAuth := index $dynamicAccounts "authentication" -}}
{{- if or (not (kindIs "map" $brokerAuth)) (ne $principalAccounts.authentication.existingSecret .Values.broker.envSecretName) (ne $principalAccounts.authentication.key (index $brokerAuth "hmac-key-env")) }}{{ fail "operator.principalAccounts authentication must reference the broker dynamic assertion key" }}{{ end -}}
{{- if or (ne $principalAccounts.ca.existingSecret (include "nvt.brokerTLSSecretName" .)) (ne $principalAccounts.ca.key "ca.crt") }}{{ fail "operator.principalAccounts CA must reference the broker TLS CA" }}{{ end -}}
{{- if gt (int $principalAccounts.assertionTTLSeconds) (int (default 300 (index $brokerAuth "max-assertion-seconds"))) }}{{ fail "operator.principalAccounts assertion TTL must not exceed the broker assertion window" }}{{ end -}}
{{- end -}}
{{- if .Values.executionDrivers.guestEnrollment.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvt-guest-enrollment-client
  namespace: {{ include "nvt.namespace" . | quote }}
  labels:
    {{- include "nvt.operatorLabels" . | nindent 4 }}
data:
  config.json: |
    {
      "version": 1,
      "baseURL": {{ .Values.executionDrivers.guestEnrollment.brokerURL | quote }},
      "serverName": {{ .Values.executionDrivers.guestEnrollment.serverName | quote }},
      "caFile": "/var/run/nvt-guest-enrollment/ca.crt",
      "bearerTokenFile": "/var/run/nvt-guest-enrollment/orchestrator-token",
      "requestTimeoutSeconds": {{ .Values.executionDrivers.guestEnrollment.requestTimeoutSeconds }},
      "handoffTimeoutSeconds": {{ .Values.executionDrivers.guestEnrollment.handoffTimeoutSeconds }},
      "ttlSeconds": {{ .Values.executionDrivers.guestEnrollment.ttlSeconds }},
      "driverRegistrations": {{ .Values.executionDrivers.guestEnrollment.registrations | toJson }}
    }
---
{{- end }}
{{- if $principalAccountsEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvt-principal-account-client
  namespace: {{ include "nvt.namespace" . | quote }}
  labels:
    {{- include "nvt.operatorLabels" . | nindent 4 }}
data:
  config.json: |
    {
      "version": 1,
      "baseURL": {{ $principalAccounts.brokerURL | quote }},
      "caFile": "/var/run/nvt-principal-accounts/ca.crt",
      "assertionKeyFile": "/var/run/nvt-principal-accounts/assertion-key",
      "assertionTTLSeconds": {{ $principalAccounts.assertionTTLSeconds }},
      "requestTimeoutSeconds": {{ $principalAccounts.requestTimeoutSeconds }},
      "maxResponseBytes": {{ $principalAccounts.maxResponseBytes }}
    }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvt-operator
  namespace: {{ include "nvt.namespace" . | quote }}
  labels:
    {{- include "nvt.operatorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  {{- if .Values.nativeEgressRelay.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "nvt.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.executionDrivers.guestEnrollment.enabled .Values.nativeEgressRelay.enabled $principalAccountsEnabled }}
      annotations:
        {{- if .Values.executionDrivers.guestEnrollment.enabled }}
        checksum/guest-enrollment-client: {{ .Values.executionDrivers.guestEnrollment | toJson | sha256sum | quote }}
        {{- end }}
        {{- if .Values.nativeEgressRelay.enabled }}
        checksum/native-egress-publication: {{ .Values.nativeEgressRelay | toJson | sha256sum | quote }}
        nvt.dev/native-egress-rollout-revision: {{ .Values.nativeEgressRelay.rolloutRevision | quote }}
        {{- end }}
        {{- if $principalAccountsEnabled }}
        checksum/principal-account-client: {{ $principalAccounts | toJson | sha256sum | quote }}
        nvt.io/dynamic-account-assertion-rotation-epoch: {{ .Values.broker.dynamicAccountAssertionRotationEpoch | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "nvt.operatorSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: nvt-operator
      {{- if or .Values.executionDrivers.registrations .Values.nativeEgressRelay.enabled $principalAccountsEnabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      containers:
        - name: manager
          image: {{ include "nvt.image" (dict "root" . "name" "operator.image" "image" .Values.operator.image) | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --callback-bind-address=:8082
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NVT_EGRESSD_IMAGE
              value: {{ include "nvt.image" (dict "root" . "name" "egress.egressd.image" "image" .Values.egress.egressd.image) | quote }}
            - name: NVT_CAPTURED_IMAGE
              value: {{ include "nvt.image" (dict "root" . "name" "egress.captured.image" "image" .Values.egress.captured.image) | quote }}
            - name: NVT_DIND_IMAGE
              value: {{ include "nvt.dindImage" . | quote }}
            - name: NVT_DIND_IMAGE_PULL_POLICY
              value: {{ .Values.dind.image.pullPolicy | quote }}
            - name: NVT_DIND_PROTECTED_CIDRS
              value: {{ join " " (concat .Values.dind.protectedCIDRs .Values.egress.denyCIDRs) | quote }}
            {{- if $brandingConfigMap }}
            - name: NVT_BRANDING_CONFIGMAP
              value: {{ $brandingConfigMap | quote }}
            {{- end }}
            - name: NVT_NETWORK_POLICY_CAPABLE
              value: {{ .Values.egress.networkPolicyCapable | quote }}
            - name: NVT_EGRESS_DENY_CIDRS
              value: {{ join "," .Values.egress.denyCIDRs | quote }}
            - name: NVT_EGRESS_ALLOWED_TCP_PORTS
              value: {{ join "," .Values.egress.allowedTCPPorts | quote }}
            - name: NVT_DEFAULT_EGRESS_MODE
              value: {{ .Values.egress.defaultMode | quote }}
            {{- if .Values.executionDrivers.registrations }}
            - name: NVT_EXECUTION_DRIVER_REGISTRATIONS_FILE
              value: /var/run/nvt-execution-drivers/registrations.json
            {{- end }}
            {{- if .Values.executionDrivers.guestEnrollment.enabled }}
            - name: NVT_GUEST_ENROLLMENT_CONFIG_FILE
              value: /var/run/nvt-guest-enrollment/config.json
            {{- end }}
            {{- if .Values.nativeEgressRelay.enabled }}
            - name: NVT_NATIVE_EGRESS_PUBLICATION_CONFIG_FILE
              value: /var/run/nvt-native-egress-publication/config.json
            - name: NVT_NATIVE_EGRESS_ATTACHMENT_CONFIG_FILE
              value: /var/run/nvt-native-egress-attachment/config.json
            {{- end }}
            {{- if $principalAccountsEnabled }}
            - name: NVT_PRINCIPAL_ACCOUNT_BROKER_CONFIG_FILE
              value: /var/run/nvt-principal-accounts/config.json
            {{- end }}
            {{- if .Values.egress.allowInsecureUpstreams }}
            - name: NVT_ALLOW_INSECURE_UPSTREAMS
              value: "1"
            {{- end }}
            {{- if and .Values.broker.enabled .Values.broker.tls.enabled }}
            - name: NVT_BROKER_URL
              value: "https://nvt-broker:7347"
            - name: NVT_BROKER_CA_SECRET
              value: {{ include "nvt.brokerTLSSecretName" . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: http
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          {{- if or .Values.executionDrivers.registrations .Values.nativeEgressRelay.enabled $principalAccountsEnabled }}
          volumeMounts:
            {{- if .Values.executionDrivers.registrations }}
            - name: execution-driver-registrations
              mountPath: /var/run/nvt-execution-drivers
              readOnly: true
            {{- if .Values.executionDrivers.guestEnrollment.enabled }}
            - name: guest-enrollment-client
              mountPath: /var/run/nvt-guest-enrollment
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.nativeEgressRelay.enabled }}
            - name: native-egress-publication
              mountPath: /var/run/nvt-native-egress-publication
              readOnly: true
            - name: native-egress-attachment
              mountPath: /var/run/nvt-native-egress-attachment
              readOnly: true
            {{- end }}
            {{- if $principalAccountsEnabled }}
            - name: principal-account-client
              mountPath: /var/run/nvt-principal-accounts
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.executionDrivers.registrations .Values.nativeEgressRelay.enabled $principalAccountsEnabled }}
      volumes:
        {{- if .Values.executionDrivers.registrations }}
        - name: execution-driver-registrations
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: nvt-execution-driver-registrations
                  items:
                    - key: registrations.json
                      path: registrations.json
              {{- range $registration := .Values.executionDrivers.registrations }}
              {{- $context := dict "root" $ "registration" $registration }}
              - secret:
                  name: {{ include "nvt.executionDriverResourceName" $context | quote }}
                  items:
                    - key: ca.crt
                      path: {{ printf "%s/ca.crt" $registration.name | quote }}
                    - key: auth-token
                      path: {{ printf "%s/auth-token" $registration.name | quote }}
              {{- end }}
        {{- if .Values.executionDrivers.guestEnrollment.enabled }}
        - name: guest-enrollment-client
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: nvt-guest-enrollment-client
                  items:
                    - key: config.json
                      path: config.json
              - secret:
                  name: {{ .Values.executionDrivers.guestEnrollment.ca.existingSecret | quote }}
                  items:
                    - key: {{ .Values.executionDrivers.guestEnrollment.ca.key | quote }}
                      path: ca.crt
              - secret:
                  name: {{ .Values.executionDrivers.guestEnrollment.orchestratorAuth.existingSecret | quote }}
                  items:
                    - key: {{ .Values.executionDrivers.guestEnrollment.orchestratorAuth.tokenKey | quote }}
                      path: orchestrator-token
        {{- end }}
        {{- end }}
        {{- if .Values.nativeEgressRelay.enabled }}
        - name: native-egress-publication
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: nvt-native-egress-publication-client
                  items:
                    - key: config.json
                      path: config.json
              - secret:
                  name: {{ .Values.nativeEgressRelay.credentials.existingSecret | quote }}
                  items:
                    - key: {{ .Values.nativeEgressRelay.credentials.controlCAKey | quote }}
                      path: control-ca.crt
                    - key: {{ .Values.nativeEgressRelay.credentials.controlTokenKey | quote }}
                      path: control-token
        - name: native-egress-attachment
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: nvt-native-egress-attachment
                  items:
                    - key: config.json
                      path: config.json
              - secret:
                  name: {{ .Values.nativeEgressRelay.credentials.existingSecret | quote }}
                  items:
                    - key: {{ .Values.nativeEgressRelay.credentials.dataCAKey | quote }}
                      path: data-ca.crt
        {{- end }}
        {{- if $principalAccountsEnabled }}
        - name: principal-account-client
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: nvt-principal-account-client
                  items:
                    - key: config.json
                      path: config.json
              - secret:
                  name: {{ $principalAccounts.ca.existingSecret | quote }}
                  items:
                    - key: {{ $principalAccounts.ca.key | quote }}
                      path: ca.crt
              - secret:
                  name: {{ $principalAccounts.authentication.existingSecret | quote }}
                  items:
                    - key: {{ $principalAccounts.authentication.key | quote }}
                      path: assertion-key
        {{- end }}
      {{- end }}
