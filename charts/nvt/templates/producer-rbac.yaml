{{- if and .Values.producer.enabled .Values.producer.rbac.create (or (eq .Values.producer.submission.mode "direct") .Values.producer.epics.enabled) }}
{{- $runNamespace := include "nvt.producerAgentRunNamespace" . }}
{{- if .Values.producer.epics.enabled }}
{{- $runNamespace = default $runNamespace .Values.producer.submission.scheduleNamespace }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nvt.producerFullname" . }}
  namespace: {{ $runNamespace | quote }}
  labels:
    {{- include "nvt.producerLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - nvt.dev
    resources:
      - agentruns
    verbs:
      - get
      - list
      {{- if eq .Values.producer.submission.mode "direct" }}
      - create
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nvt.producerFullname" . }}
  namespace: {{ $runNamespace | quote }}
  labels:
    {{- include "nvt.producerLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nvt.producerServiceAccountName" . }}
    namespace: {{ include "nvt.namespace" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nvt.producerFullname" . }}
{{- end }}
