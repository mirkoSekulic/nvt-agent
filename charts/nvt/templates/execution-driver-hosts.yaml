{{- $root := . -}}
{{- range $registration := .Values.executionDrivers.registrations }}
{{- $context := dict "root" $root "registration" $registration -}}
{{- $name := include "nvt.executionDriverResourceName" $context -}}
{{- $secretData := include "nvt.executionDriverSecretData" $context | fromJson -}}
{{- if $registration.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nvt.executionDriverServiceAccountName" $context | quote }}
  namespace: {{ include "nvt.namespace" $root | quote }}
  labels:
    {{- include "nvt.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/component: execution-driver-host
  {{- with $registration.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "nvt.namespace" $root | quote }}
  labels:
    {{- include "nvt.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/component: execution-driver-host
type: Opaque
data:
  tls.crt: {{ index $secretData "tls.crt" }}
  tls.key: {{ index $secretData "tls.key" }}
  ca.crt: {{ index $secretData "ca.crt" }}
  auth-token: {{ index $secretData "auth-token" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "nvt.namespace" $root | quote }}
  labels:
    {{- include "nvt.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/component: execution-driver-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/name: {{ $name | quote }}
  template:
    metadata:
      annotations:
        checksum/host-auth: {{ $secretData | toJson | sha256sum | quote }}
      labels:
        {{- include "nvt.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $name | quote }}
        app.kubernetes.io/component: execution-driver-host
        nvt.dev/execution-driver-registration: {{ $registration.name | quote }}
        {{- with $registration.serviceAccount.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nvt.executionDriverServiceAccountName" $context | quote }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-host
          image: {{ include "nvt.executionDriverHostImage" $root | quote }}
          imagePullPolicy: {{ $root.Values.executionDrivers.hostImage.pullPolicy }}
          args:
            - install
            - --destination=/nvt-host/nvt-execution-driver-host
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: host-binary
              mountPath: /nvt-host
      containers:
        - name: driver-host
          image: {{ $registration.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /nvt-host/nvt-execution-driver-host
          args:
            - serve
            - --listen=:9443
            - {{ printf "--driver-instance=%s" $registration.name | quote }}
            - {{ printf "--driver-command=%s" (first $registration.command) | quote }}
            {{- range (rest $registration.command) }}
            - {{ printf "--driver-arg=%s" . | quote }}
            {{- end }}
            {{- range (default (list) $registration.passEnv) }}
            - {{ printf "--pass-env=%s" . | quote }}
            {{- end }}
            {{- range (default (list) $registration.secretEnvironment) }}
            - {{ printf "--pass-env=%s" .name | quote }}
            {{- end }}
            - --tls-cert=/var/run/nvt-host-auth/tls.crt
            - --tls-key=/var/run/nvt-host-auth/tls.key
            - --auth-token=/var/run/nvt-host-auth/auth-token
            {{- if and $root.Values.executionDrivers.guestEnrollment.enabled (has $registration.name $root.Values.executionDrivers.guestEnrollment.registrations) }}
            - --enrollment-socket=/tmp/nvt-guest-enrollment.sock
            - {{ printf "--enrollment-timeout=%vs" $root.Values.executionDrivers.guestEnrollment.handoffTimeoutSeconds | quote }}
            {{- end }}
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
          {{- with $registration.secretEnvironment }}
          env:
            {{- range . }}
            - name: {{ .name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .key | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $registration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          startupProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: host-binary
              mountPath: /nvt-host
              readOnly: true
            - name: host-auth
              mountPath: /var/run/nvt-host-auth
              readOnly: true
            - name: scratch
              mountPath: /tmp
            {{- range (default (list) $registration.secretFiles) }}
            - name: {{ printf "credential-%s" .name | quote }}
              mountPath: {{ printf "/var/run/secrets/nvt-execution-driver/%s" .name | quote }}
              readOnly: true
            {{- end }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: host-binary
          emptyDir: {}
        - name: host-auth
          secret:
            secretName: {{ $name | quote }}
            defaultMode: 0440
        - name: scratch
          emptyDir: {}
        {{- range (default (list) $registration.secretFiles) }}
        - name: {{ printf "credential-%s" .name | quote }}
          secret:
            secretName: {{ .secretName | quote }}
            defaultMode: 0440
            items:
              {{- range .items }}
              - key: {{ .key | quote }}
                path: {{ .path | quote }}
              {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "nvt.namespace" $root | quote }}
  labels:
    {{- include "nvt.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/component: execution-driver-host
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/name: {{ $name | quote }}
  ports:
    - name: https
      port: 9443
      targetPort: https
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "nvt.namespace" $root | quote }}
  labels:
    {{- include "nvt.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name | quote }}
    app.kubernetes.io/component: execution-driver-host
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/name: {{ $name | quote }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/name: nvt-operator
      ports:
        - protocol: TCP
          port: 9443
---
{{- end }}

{{- if .Values.executionDrivers.registrations }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvt-execution-driver-registrations
  namespace: {{ include "nvt.namespace" . | quote }}
  labels:
    {{- include "nvt.operatorLabels" . | nindent 4 }}
data:
  registrations.json: |
    {
      "version": 1,
      "registrations": [
        {{- range $index, $registration := .Values.executionDrivers.registrations }}
        {{- $context := dict "root" $ "registration" $registration -}}
        {{- $name := include "nvt.executionDriverResourceName" $context -}}
        {{- if $index }},{{ end }}
        {
          "name": {{ $registration.name | quote }},
          "url": {{ printf "https://%s.%s.svc:9443" $name (include "nvt.namespace" $) | quote }},
          "serverName": {{ printf "%s.%s.svc" $name (include "nvt.namespace" $) | quote }},
          "caFile": {{ printf "/var/run/nvt-execution-drivers/%s/ca.crt" $registration.name | quote }},
          "tokenFile": {{ printf "/var/run/nvt-execution-drivers/%s/auth-token" $registration.name | quote }}
        }
        {{- end }}
      ]
    }
{{- end }}
