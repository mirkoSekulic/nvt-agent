{{- if .Values.broker.enabled }}
{{- $dynamicAccountsEnabled := false }}
{{- $dynamicAccounts := index .Values.broker.config "dynamic-accounts" }}
{{- $dynamicAssertionRotationEpoch := .Values.broker.dynamicAccountAssertionRotationEpoch | default "" }}
{{- if $dynamicAccounts }}
{{- if not (kindIs "map" $dynamicAccounts) }}{{ fail "broker.config.dynamic-accounts must be an object" }}{{ end }}
{{- if hasKey $dynamicAccounts "enabled" }}
{{- if not (kindIs "bool" (index $dynamicAccounts "enabled")) }}{{ fail "broker.config.dynamic-accounts.enabled must be a boolean" }}{{ end }}
{{- $dynamicAccountsEnabled = index $dynamicAccounts "enabled" }}
{{- end }}
{{- end }}
{{- if and $dynamicAssertionRotationEpoch (not (regexMatch `^[A-Za-z0-9._-]{1,128}$` $dynamicAssertionRotationEpoch)) }}{{ fail "broker.dynamicAccountAssertionRotationEpoch must be a bounded non-secret rotation identifier" }}{{ end }}
{{- if $dynamicAccountsEnabled }}
{{- if not .Values.broker.persistence.enabled }}{{ fail "broker.config.dynamic-accounts.enabled requires broker.persistence.enabled=true" }}{{ end }}
{{- if not .Values.broker.tls.enabled }}{{ fail "broker.config.dynamic-accounts.enabled requires broker.tls.enabled=true" }}{{ end }}
{{- if not .Values.broker.envSecretName }}{{ fail "broker.config.dynamic-accounts.enabled requires broker.envSecretName for assertion authentication" }}{{ end }}
{{- $dynamicStateDir := index $dynamicAccounts "state-dir" | default "" }}
{{- if or (not (kindIs "string" $dynamicStateDir)) (not (regexMatch `^/state/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$` $dynamicStateDir)) (contains ".." $dynamicStateDir) }}{{ fail "broker.config.dynamic-accounts.state-dir must be a normalized path below /state" }}{{ end }}
{{- $dynamicAuthentication := index $dynamicAccounts "authentication" }}
{{- if not (kindIs "map" $dynamicAuthentication) }}{{ fail "broker.config.dynamic-accounts.authentication must be an object" }}{{ end }}
{{- $maxEligibilityLeaseSeconds := int (default 3600 (index $dynamicAuthentication "max-eligibility-lease-seconds")) }}
{{- if or (lt $maxEligibilityLeaseSeconds 300) (gt $maxEligibilityLeaseSeconds 86400) }}{{ fail "broker dynamic eligibility lease window must be 300..86400 seconds" }}{{ end }}
{{- end }}
{{- if and .Values.broker.persistence.seedSecretName (not .Values.broker.persistence.enabled) }}
{{- fail "broker.persistence.seedSecretName requires broker.persistence.enabled=true" }}
{{- end }}
{{- if and .Values.broker.persistence.seedSecretName (or (not (regexMatch `^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$` .Values.broker.persistence.seedTargetDir)) (hasPrefix "/" .Values.broker.persistence.seedTargetDir) (contains ".." .Values.broker.persistence.seedTargetDir) (contains `\` .Values.broker.persistence.seedTargetDir)) }}
{{- fail "broker.persistence.seedTargetDir must be a normalized relative path without traversal" }}
{{- end }}
{{- if .Values.broker.guestEnrollment.enabled }}
{{- if not .Values.broker.persistence.enabled }}{{ fail "broker.guestEnrollment.enabled requires broker.persistence.enabled=true" }}{{ end }}
{{- if not .Values.broker.tls.enabled }}{{ fail "broker.guestEnrollment.enabled requires broker.tls.enabled=true" }}{{ end }}
{{- if or (gt (len .Values.broker.guestEnrollment.exchangeURL) 2048) (not (regexMatch `^https://[A-Za-z0-9](?:[-A-Za-z0-9.]*[A-Za-z0-9])?(?::[0-9]{1,5})?/v1/guest-enrollment/exchange$` .Values.broker.guestEnrollment.exchangeURL)) }}{{ fail "broker.guestEnrollment.exchangeURL must be the canonical HTTPS broker exchange endpoint" }}{{ end }}
{{- $guestEnrollmentPortMatch := regexFind `:[0-9]{1,5}/v1/guest-enrollment/exchange$` .Values.broker.guestEnrollment.exchangeURL }}
{{- if $guestEnrollmentPortMatch }}
{{- $guestEnrollmentPort := int (trimSuffix "/v1/guest-enrollment/exchange" (trimPrefix ":" $guestEnrollmentPortMatch)) }}
{{- if or (lt $guestEnrollmentPort 1) (gt $guestEnrollmentPort 65535) }}{{ fail "broker.guestEnrollment.exchangeURL port must be between 1 and 65535" }}{{ end }}
{{- end }}
{{- if or (gt (len .Values.broker.guestEnrollment.orchestratorAuth.existingSecret) 253) (not (regexMatch `^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$` .Values.broker.guestEnrollment.orchestratorAuth.existingSecret)) }}{{ fail "broker.guestEnrollment.orchestratorAuth.existingSecret must be a Kubernetes Secret name" }}{{ end }}
{{- if or (gt (len .Values.broker.guestEnrollment.orchestratorAuth.tokenKey) 253) (not (regexMatch `^[A-Za-z0-9._-]+$` .Values.broker.guestEnrollment.orchestratorAuth.tokenKey)) }}{{ fail "broker.guestEnrollment.orchestratorAuth.tokenKey is invalid" }}{{ end }}
{{- if or (lt (int .Values.broker.guestEnrollment.runtimeIdentityHistoryCapacity) 20000) (gt (int .Values.broker.guestEnrollment.runtimeIdentityHistoryCapacity) 10000000) }}{{ fail "broker.guestEnrollment.runtimeIdentityHistoryCapacity must be between 20000 and 10000000" }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvt-broker
  namespace: {{ include "nvt.namespace" . | quote }}
  labels:
    {{- include "nvt.brokerLabels" . | nindent 4 }}
spec:
  # nvt-broker is a single writer for provider state under /state; do not scale.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nvt.brokerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The broker loads its provider config once at startup and does not
        # hot-reload it, so a broker.config change must roll the Deployment.
        checksum/broker-config: {{ include "nvt.brokerConfigChecksum" . | quote }}
        {{- if $dynamicAssertionRotationEpoch }}
        nvt.io/dynamic-account-assertion-rotation-epoch: {{ $dynamicAssertionRotationEpoch | quote }}
        {{- end }}
        {{- if .Values.broker.tls.enabled }}
        # The broker loads its TLS cert/key once at startup; this checksum
        # restarts it when the TLS Secret material (or name) changes.
        checksum/broker-tls: {{ include "nvt.brokerTLSChecksum" . | quote }}
        {{- end }}
      labels:
        {{- include "nvt.brokerSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: broker
          image: {{ include "nvt.image" (dict "root" . "name" "broker.image" "image" .Values.broker.image) | quote }}
          imagePullPolicy: {{ .Values.broker.image.pullPolicy }}
          {{- if and .Values.broker.persistence.enabled .Values.broker.persistence.seedSecretName }}
          command:
            - /opt/nvt-broker/broker/seed_supervisor.py
            - --
            - /opt/nvt-broker/broker/brokerd.py
          {{- end }}
          ports:
            - name: http
              containerPort: 7347
          env:
            - name: NVT_BROKER_BIND
              value: 0.0.0.0:7347
            - name: NVT_BROKER_CONFIG
              value: /config/broker.yaml
            - name: NVT_BROKER_AGENTS_CONFIG
              value: /config/agents.yaml
            - name: NVT_BROKER_AUDIT_LOG
              value: /state/audit.jsonl
            {{- if .Values.broker.guestEnrollment.enabled }}
            - name: NVT_BROKER_GUEST_ENROLLMENT_ENABLED
              value: "true"
            - name: NVT_BROKER_GUEST_ENROLLMENT_DB
              value: /state/guest-enrollment.sqlite3
            - name: NVT_BROKER_GUEST_ENROLLMENT_EXCHANGE_URL
              value: {{ .Values.broker.guestEnrollment.exchangeURL | quote }}
            - name: NVT_BROKER_GUEST_ENROLLMENT_ORCHESTRATOR_TOKEN_FILE
              value: /guest-enrollment-auth/token
            - name: NVT_BROKER_GUEST_ENROLLMENT_RUNTIME_IDENTITY_HISTORY_CAPACITY
              value: {{ .Values.broker.guestEnrollment.runtimeIdentityHistoryCapacity | quote }}
            {{- end }}
            {{- if and .Values.broker.persistence.enabled .Values.broker.persistence.seedSecretName }}
            - name: NVT_BROKER_SEED_DIR
              value: /seed
            - name: NVT_BROKER_STATE_DIR
              value: /state
            - name: NVT_BROKER_SEED_TARGET_DIR
              value: {{ .Values.broker.persistence.seedTargetDir | quote }}
            {{- end }}
            {{- if .Values.broker.tls.enabled }}
            - name: NVT_BROKER_TLS_CERT
              value: /tls/tls.crt
            - name: NVT_BROKER_TLS_KEY
              value: /tls/tls.key
            {{- end }}
          {{- if .Values.broker.envSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.broker.envSecretName | quote }}
          {{- end }}
          volumeMounts:
            - name: broker-config
              mountPath: /config
              readOnly: true
            - name: broker-state
              mountPath: /state
            {{- if and .Values.broker.persistence.enabled .Values.broker.persistence.seedSecretName }}
            - name: broker-state-seed
              mountPath: /seed
              readOnly: true
            {{- end }}
            {{- if .Values.broker.tls.enabled }}
            - name: broker-tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- if .Values.broker.guestEnrollment.enabled }}
            - name: guest-enrollment-orchestrator-auth
              mountPath: /guest-enrollment-auth
              readOnly: true
            {{- end }}
          {{- if or (and .Values.broker.persistence.enabled .Values.broker.persistence.seedSecretName) .Values.broker.guestEnrollment.enabled $dynamicAccountsEnabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.broker.tls.enabled }}
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          {{- end }}
      volumes:
        {{- if .Values.broker.tls.enabled }}
        - name: broker-tls
          secret:
            secretName: {{ include "nvt.brokerTLSSecretName" . | quote }}
        {{- end }}
        - name: broker-config
          projected:
            sources:
              - configMap:
                  name: nvt-broker-config
                  items:
                    - key: broker.yaml
                      path: broker.yaml
              - configMap:
                  name: nvt-broker-agents
                  items:
                    - key: agents.yaml
                      path: agents.yaml
        - name: broker-state
          {{- if .Values.broker.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "nvt-broker-state" .Values.broker.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and .Values.broker.persistence.enabled .Values.broker.persistence.seedSecretName }}
        - name: broker-state-seed
          secret:
            secretName: {{ .Values.broker.persistence.seedSecretName | quote }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.broker.guestEnrollment.enabled }}
        - name: guest-enrollment-orchestrator-auth
          secret:
            secretName: {{ .Values.broker.guestEnrollment.orchestratorAuth.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.broker.guestEnrollment.orchestratorAuth.tokenKey | quote }}
                path: token
        {{- end }}
{{- end }}
