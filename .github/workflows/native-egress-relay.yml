name: native egress relay

on:
  push:
    branches:
      - main
    paths:
      - "nativeegressrelay/**"
      - "protocol/native-egress.md"
      - "protocol/guestenrollment/nativeegress/**"
      - "protocol/guestenrollment/native_egress_identity.go"
      - ".github/workflows/native-egress-relay.yml"
  pull_request:
    paths:
      - "nativeegressrelay/**"
      - "protocol/native-egress.md"
      - "protocol/guestenrollment/nativeegress/**"
      - "protocol/guestenrollment/native_egress_identity.go"
      - ".github/workflows/native-egress-relay.yml"

permissions:
  contents: read

concurrency:
  group: native-egress-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: relay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nativeegressrelay/go.mod
          cache-dependency-path: |
            nativeegressrelay/go.mod
            protocol/guestenrollment/go.mod
      - name: Run relay trusted-core tests
        working-directory: nativeegressrelay
        run: |
          go vet ./...
          go test -race -count=1 ./...

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: protocol/guestenrollment/go.mod
          cache-dependency-path: protocol/guestenrollment/go.mod
      - name: Run native-egress conformance
        working-directory: protocol/guestenrollment
        run: |
          go vet ./...
          go test -race -count=10 ./nativeegress/...
