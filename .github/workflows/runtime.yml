name: runtime

on:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "dind/**"
      - "templates/**"
      - "scripts/**"
      - "Makefile"
      - "tests/agentd/**"
      - "tests/runtime/**"
      - "tests/pi/**"
      - "egressd/**"
      - "broker/**"
      - "protocol/**"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "dind/**"
      - "templates/**"
      - "scripts/**"
      - "Makefile"
      - "tests/agentd/**"
      - "tests/runtime/**"
      - "tests/pi/**"
      - "egressd/**"
      - "broker/**"
      - "protocol/**"
      - ".github/workflows/runtime.yml"

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TERM: screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/agentd/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install agentd test dependencies
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 180 sudo apt-get -o Acquire::Retries=3 -y install tmux
          fi
          python3 -m pip install PyYAML
      - name: Run agentd conformance suite
        working-directory: tests/agentd
        env:
          AGENTD_BIN: python3 ${{ github.workspace }}/runtime/agentd/agentd.py
          AGENTDCTL_BIN: python3 ${{ github.workspace }}/runtime/agentd/agentdctl.py
          PROMPT_AGENT_BIN: bash ${{ github.workspace }}/runtime/core/prompt-agent.sh
        run: go test -v ./...

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERM: screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: tests/runtime/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install runtime test dependencies
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            timeout 180 sudo apt-get -o Acquire::Retries=3 -y install tmux
          fi
          python3 -m pip install PyYAML
      - name: Run runtime conformance suite
        working-directory: tests/runtime
        env:
          EXPORT_PLUGIN_TOOLS_BIN: python3 ${{ github.workspace }}/runtime/core/export-plugin-tools.py
          RUN_PLUGINS_BIN: python3 ${{ github.workspace }}/runtime/core/run-plugins.py
        run: go test -v ./...

  required-docker-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Install exact kind regression version
        run: go install sigs.k8s.io/kind@v0.32.0
      - name: Build NVT DinD image
        run: make dind-build
      - name: Run Docker prune and nested kind network smoke
        run: bash tests/runtime/kind-required-network-smoke.sh

  pi-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pi fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          python3 -m pip install PyYAML
          npm install --prefix "$RUNNER_TEMP/pi-test" --no-audit --no-fund @earendil-works/pi-coding-agent@0.85.1
      - name: Build trusted egress fixture
        working-directory: egressd
        run: go build -o "$RUNNER_TEMP/pi-test/egressd" ./cmd/egressd
      - name: Test real Pi terminal and mediated model access
        run: |
          NVT_PI_TEST_BINARY="$RUNNER_TEMP/pi-test/node_modules/.bin/pi" \
          NVT_PI_TEST_EGRESSD="$RUNNER_TEMP/pi-test/egressd" \
            python3 tests/pi/compatibility.py
