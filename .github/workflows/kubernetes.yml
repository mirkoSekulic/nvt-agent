name: kubernetes

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - "gateway/**"
      - "credentialportal/**"
      - "producers/github-comments/**"
      - "charts/**"
      - "scripts/**"
      - "tests/operator/**"
      - "protocol/**"
      - "Makefile"
      - ".github/workflows/kubernetes.yml"
  pull_request:
    paths:
      - "operator/**"
      - "gateway/**"
      - "credentialportal/**"
      - "producers/github-comments/**"
      - "charts/**"
      - "scripts/**"
      - "tests/operator/**"
      - "protocol/**"
      - "Makefile"
      - ".github/workflows/kubernetes.yml"

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: protocol/eligibility/go.mod
          cache: false
      - name: Run shared eligibility contract and conformance tests
        working-directory: protocol/eligibility
        run: |
          go vet ./...
          go test -race -count=1 ./...

  resolved-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: protocol/resolvedrun/go.mod
          cache: false
      - name: Run resolved agent-run contract and resolution tests
        working-directory: protocol/resolvedrun
        run: |
          go vet ./...
          go test -race -count=1 ./...

  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            operator/go.sum
            protocol/resolvedrun/go.mod
      - name: Run operator tests
        working-directory: operator
        run: |
          go vet ./...
          go test ./...

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            gateway/go.sum
            protocol/eligibility/go.mod
      - name: Run gateway tests
        working-directory: gateway
        run: |
          go vet ./...
          go test -race -count=1 ./...

  credential-portal:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            credentialportal/go.sum
            protocol/eligibility/go.mod
      - name: Run credential portal security and service tests
        working-directory: credentialportal
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go test -race -count=10 -run 'TestEnrollmentRejectsCrossOwnerStatusCodeAndCancellation|TestEnrollmentTimeoutAuthExpiryAndLogoutCancellation' ./internal/portal

  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: producers/github-comments/go.sum
      - name: Run github-comments producer tests
        working-directory: producers/github-comments
        run: |
          go vet ./...
          go test ./...

  operator-helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Run operator Helm and shell coverage
        run: make operator-helm-test
