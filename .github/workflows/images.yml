name: images

on:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "assets/branding/**"
      - "dind/**"
      - "broker/**"
      - "egressd/**"
      - "captured/**"
      - "operator/**"
      - "protocol/guestenrollment/**"
      - "gateway/**"
      - "producers/github-comments/**"
      - "tests/fixtures/echo/**"
      - "tests/fixtures/execution-driver/**"
      - "tests/operator/execution-driver-host-image-smoke.sh"
      - "scripts/**"
      - "Makefile"
      - "tests/runtime/git_credentials_smoke.sh"
      - "tests/runtime/dind-kmsg-device-smoke.sh"
      - "tests/runtime/code-server-branding-smoke.sh"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "assets/branding/**"
      - "dind/**"
      - "broker/**"
      - "egressd/**"
      - "captured/**"
      - "operator/**"
      - "protocol/guestenrollment/**"
      - "gateway/**"
      - "producers/github-comments/**"
      - "tests/fixtures/echo/**"
      - "tests/fixtures/execution-driver/**"
      - "tests/operator/execution-driver-host-image-smoke.sh"
      - "scripts/**"
      - "Makefile"
      - "tests/runtime/git_credentials_smoke.sh"
      - "tests/runtime/dind-kmsg-device-smoke.sh"
      - "tests/runtime/code-server-branding-smoke.sh"
      - ".github/workflows/images.yml"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            dockerfile: runtime/Dockerfile
            image: nvt-agent:test
            smoke: true
            branding: true
          - name: dind
            dockerfile: dind/Dockerfile
            image: nvt-dind:test
            test: dind/test.sh
            integration: tests/runtime/dind-kmsg-device-smoke.sh
          - name: broker
            dockerfile: broker/Dockerfile
            image: nvt-broker:test
          - name: egressd
            dockerfile: egressd/Dockerfile
            image: nvt-egressd:test
          - name: captured
            dockerfile: captured/Dockerfile
            image: nvt-captured:test
          - name: operator
            dockerfile: operator/Dockerfile
            image: nvt-operator:test
          - name: execution-driver-host
            dockerfile: operator/executiondriver/host-image/Dockerfile
            image: nvt-execution-driver-host:test
            hostIntegration: true
          - name: gateway
            dockerfile: gateway/Dockerfile
            image: nvt-agent-gateway:test
          - name: producer
            dockerfile: producers/github-comments/Dockerfile
            image: nvt-github-comments-producer:test
          - name: echo
            dockerfile: tests/fixtures/echo/Dockerfile
            image: nvt-smoke-echo:test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build ${{ matrix.name }} image
        run: docker build -t "${{ matrix.image }}" -f "${{ matrix.dockerfile }}" .
      - name: Run runtime git credentials smoke
        if: matrix.smoke
        run: bash tests/runtime/git_credentials_smoke.sh "${{ matrix.image }}"
      - name: Verify runtime code-server branding
        if: matrix.branding
        env:
          NVT_RUNTIME_BRANDING_IMAGE: ${{ matrix.image }}
        run: bash tests/runtime/code-server-branding-smoke.sh
      - name: Run ${{ matrix.name }} script tests
        if: matrix.test
        run: bash "${{ matrix.test }}"
      - name: Run ${{ matrix.name }} integration smoke
        if: matrix.integration
        env:
          NVT_DIND_TEST_IMAGE: ${{ matrix.image }}
        run: bash "${{ matrix.integration }}"
      - name: Run execution-driver host OCI smoke
        if: matrix.hostIntegration
        env:
          NVT_EXECUTION_DRIVER_HOST_IMAGE: ${{ matrix.image }}
        run: bash tests/operator/execution-driver-host-image-smoke.sh
