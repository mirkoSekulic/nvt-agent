name: azure execution driver

on:
  pull_request:
    paths:
      - "executiondrivers/azure/**"
      - "operator/executiondriver/**"
      - "protocol/guestenrollment/**"
      - ".github/workflows/azure.yml"
  push:
    branches: [main]
    paths:
      - "executiondrivers/azure/**"
      - "operator/executiondriver/**"
      - "protocol/guestenrollment/**"
      - ".github/workflows/azure.yml"

permissions:
  contents: read

concurrency:
  group: azure-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: executiondrivers/azure/go.mod
          cache-dependency-path: |
            executiondrivers/azure/go.sum
            operator/go.sum
      - name: Vet and race-test Azure driver
        run: cd executiondrivers/azure && go vet ./... && go test -race -count=1 ./...
      - name: Verify provider-neutral core boundary
        run: bash executiondrivers/azure/provider-boundary-test.sh
      - name: Verify reviewed Bicep compilation
        run: bash executiondrivers/azure/bicep-check.sh
