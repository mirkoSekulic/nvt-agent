broker:
  persistence:
    enabled: true
    seedSecretName: nvt-portal-seed
    seedTargetDir: oauth
credentialPortal:
  enabled: true
  publicURL: https://agents.example.test/agents/credentials
  enrollment:
    experimentalCodexDeviceAuth: true
  auth:
    mode: oidc
    eligibility:
      default: deny
      rules:
        - id: approved-party
          effect: allow
          where:
            array: memberships[]
            all:
              - claimPath: organization.ID
                values: ["0192:123456789"]
              - claimPath: resource
                values: [approved-resource]
    claimEnrichment:
      allowedHosts: [claims.identity.example]
      timeoutSeconds: 5
      limits:
        maxResponseBytes: 65536
        maxDepth: 8
        maxArrayItems: 64
        maxObjectProperties: 64
        maxTotalNodes: 1024
        maxStringBytes: 1024
      sources:
        - endpoint: https://claims.identity.example/v1/memberships
          outputClaim: memberships
          valuePath: $
    session:
      existingSecret: nvt-portal-session
    oidc:
      issuerURL: https://identity.example.test
      clientID: nvt-credential-portal
      clientSecret:
        existingSecret: nvt-portal-oidc
  slots:
    - name: alice-codex
      label: Alice Codex
      owner:
        issuer: https://identity.example.test
        subject: alice-stable-subject
      adapter: codex-oauth-file
      brokerProvider: codex-primary
      secretName: nvt-portal-seed
      dataKey: codex-auth.json
    - name: bob-claude
      label: Bob Claude
      owner:
        issuer: https://identity.example.test
        subject: bob-stable-subject
      adapter: claude-oauth-file
      brokerProvider: claude-primary
      secretName: nvt-portal-seed
      dataKey: claude-credentials.json
gateway:
  enabled: true
  credentialPortal:
    url: /agents/credentials
    label: Manage credentials
