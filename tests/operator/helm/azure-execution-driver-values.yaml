executionDrivers:
  registrations:
    - name: azure-production
      image: ghcr.io/mirkosekulic/nvt-azure-execution-driver@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      command:
        - /usr/local/bin/nvt-azure-driver
      resources:
        requests: {cpu: 200m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
      storage:
        size: 20Gi
      serviceAccount:
        create: true
        annotations:
          azure.workload.identity/client-id: 11111111-1111-4111-8111-111111111111
          azure.workload.identity/tenant-id: 22222222-2222-4222-8222-222222222222
        podLabels:
          azure.workload.identity/use: "true"
      passEnv:
        - AZURE_CLIENT_ID
        - AZURE_TENANT_ID
        - AZURE_FEDERATED_TOKEN_FILE
