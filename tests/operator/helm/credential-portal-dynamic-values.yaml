broker:
  envSecretName: nvt-broker-dynamic-account-auth
  persistence:
    enabled: true
  config:
    providers: []
    dynamic-accounts:
      enabled: true
      state-dir: /state/principal-accounts
      authentication:
        hmac-key-env: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
      provider-templates:
        - name: approved-codex
          plugin: codex-oauth
          credential-config-key: auth-file
          config: {}
        - name: approved-claude
          plugin: claude-oauth
          credential-config-key: credentials-file
          config: {}
      credential-templates:
        - name: approved-one
          label: Approved one
          enrollment-adapter: codex-oauth-file
          provider-template: approved-codex
        - name: approved-two
          label: Approved two
          enrollment-adapter: claude-oauth-file
          provider-template: approved-claude
credentialPortal:
  enabled: true
  publicURL: https://agents.example.test/agents/credentials
  maxUploadBytes: 786432
  enrollment:
    experimentalCodexDeviceAuth: true
  recoveryUpload:
    enabled: true
  dynamic:
    enabled: true
    broker:
      url: https://nvt-broker:7347
      ca:
        existingSecret: nvt-broker-tls
        key: ca.crt
      authentication:
        existingSecret: nvt-broker-dynamic-account-auth
        key: NVT_DYNAMIC_ACCOUNT_ASSERTION_KEY
    templates:
      - name: approved-one
        label: Approved one
        adapter: codex-oauth-file
      - name: approved-two
        label: Approved two
        adapter: claude-oauth-file
  auth:
    mode: oidc
    eligibility:
      default: deny
      rules:
        - id: eligible
          effect: allow
          authenticated: true
    session:
      existingSecret: nvt-portal-session
    oidc:
      issuerURL: https://identity.example.test
      clientID: nvt-credential-portal
      clientSecret:
        existingSecret: nvt-portal-oidc
  slots: []
  networkPolicy:
    egressTCPPorts: [443, 7347]
gateway:
  enabled: true
  credentialPortal:
    url: /agents/credentials
    label: Manage credentials
