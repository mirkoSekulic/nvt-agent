executionDrivers:
  registrations:
    - name: fake-east
      image: registry.example.test/nvt/fake-driver@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      command:
        - /fake-driver
        - --region=east
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
      storage:
        size: 20Gi
        storageClassName: fast-state
      serviceAccount:
        create: true
        annotations:
          identity.example.test/client-id: east-client
        podLabels:
          identity.example.test/use: "true"
      passEnv:
        - WORKLOAD_IDENTITY_TOKEN_FILE
      secretEnvironment:
        - name: CLOUD_TOKEN
          secretName: fake-east-cloud
          key: token
      secretFiles:
        - name: cloud
          secretName: fake-east-cloud
          items:
            - key: config
              path: config.json
    - name: fake-west
      image: registry.example.test/nvt/fake-driver@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      command:
        - /fake-driver
      resources:
        requests:
          cpu: 200m
          memory: 128Mi
        limits:
          cpu: "2"
          memory: 512Mi
      serviceAccount:
        create: false
        name: fake-west-workload-identity
      secretEnvironment:
        - name: CLOUD_TOKEN
          secretName: fake-west-cloud
          key: token
