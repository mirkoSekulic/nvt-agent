agentSchedule:
  principalParallelism:
    defaultMaxParallelism: 2
    overrides:
      - issuer: https://github.com
        subject: "23359247"
        maxParallelism: 4
  executionClasses:
    - name: vm-standard
      kind: vm
      driver: example-vm
      configuration:
        cpu: 4
        network:
          isolation: required
  template:
    image: runtime:test
    runtimeClassName: kata-vm-isolation
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "2"
        memory: 8Gi
    tolerations:
      - key: purpose
        operator: Equal
        value: nvt-agent
        effect: NoSchedule
    workspace:
      mode: Persistent
      size: 20Gi
      dockerSize: 30Gi
      storageClassName: managed-csi
    agent:
      config:
        plugins:
          - name: work-control
            source: builtin
    lifecycle:
      completeOn:
        - plugin.work.completed
        - plugin.github.pr.merged
        - plugin.github.pr.closed
      failOn:
        - plugin.work.failed
  profiles:
    - name: default-codex
      execution:
        kind: pod
        driver: kubernetes
      runtime:
        type: codex
        autonomy: trusted-local
        container:
          capabilities:
            add:
              - SYS_PTRACE
        docker:
          kernelLogDevice: true
          requiredNetworks:
            - name: kind
              subnet: 172.31.250.0/24
      agentRuntimeConfig:
        command: codex
        proxy:
          provider: codex-main
      workspaceInstructions: |
        Follow the administrator-owned repository workflow.
        Keep changes focused and run repository checks.
      egress: mediated
      egressEnforcement: true
      egressTransport: forward-proxy
      egressMaxConcurrentTunnels: 512
      broker:
        grants:
          - provider: codex-main
            repositories: [example/*]
            materialization: placeholder-file
            egressHosts: [chatgpt.com]
          - provider: github-main-app
            repositories: [example/*]
            materialization: header-inject
            egressHosts: [github.com]
            git: true
            preparations:
              - operation: identity
          - provider: clusters
            repositories: []
            resources: [studio-staging-aks]
            materialization: header-inject
            egressHosts: [k-fixture.kube.nvt.invalid]
            authorization:
              preset: observe
  profileSelection:
    defaultProfile: default-codex
    onNoMatch: useDefault
    rules: []
  workflowProfiles:
    - name: implement-pr
      workspaceInstructions: |
        Implement the change and create a pull request.
    - name: review-pr
      workspaceInstructions: |
        Review the pull request and report findings first.
    - name: generic-run
      workspaceInstructions: |
        Perform the requested task and report the result to the source thread.
  producerPolicies:
    - identity: system:serviceaccount:custom-ns:producer
      workflows: [implement-pr, review-pr, generic-run]
      defaultWorkflow: implement-pr

producer:
  enabled: true
  repositories:
    - owner: example
      name: project
  githubApp:
    appID: 123
    installationID: 456
  submission:
    admissionMode: profiled
    commandWorkflows:
      pr-create: implement-pr
      review: review-pr
      run: generic-run
