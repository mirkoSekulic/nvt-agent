# Overlay for a deployment using the optional Azure broker/runtime images.
broker:
  image: {repository: nvt-broker-azure, tag: local}
  persistence: {enabled: true}
  config:
    provider-plugins:
      - name: azure
        command: [/opt/nvt-broker/broker/providers/azure/provider.py]
        request-timeout-seconds: 45
    providers:
      - name: azure-dev
        plugin: azure
        config:
          cloud: AzureCloud
          tenant: 22222222-2222-2222-2222-222222222222
          subscriptions: [11111111-1111-1111-1111-111111111111]
          state-dir: /state/azure/azure-dev
        allow:
          resources:
            - arm:/subscriptions/11111111-1111-1111-1111-111111111111
            - query-identity/22222222-2222-2222-2222-222222222222
          authorization:
            defaultAction: deny
            rules:
              - {operation: observe, resource: azure/arm:/subscriptions/11111111-1111-1111-1111-111111111111}
              - {operation: observe, resource: azure/query-identity/22222222-2222-2222-2222-222222222222}
runtime:
  image: {repository: nvt-agent-azure, tag: local}
egress:
  networkPolicyCapable: true
agentSchedule:
  template:
    workspace: {mode: Ephemeral}
    agent:
      config:
        plugins:
          - name: azure-cli
            source: builtin
            egress: {provider: azure-dev}
            config:
              providers:
                azure-dev:
                  tenant: 22222222-2222-2222-2222-222222222222
                  subscriptions: [{id: 11111111-1111-1111-1111-111111111111}]
  profiles:
    - name: azure-inspection
      runtime: {type: codex, autonomy: trusted-local}
      # Diagnostic shell example; merge these grants/plugin into your normal
      # agent profile to use an AI runtime and its separately granted identity.
      agentRuntimeConfig:
        command: bash
        args: [-lc, "sleep infinity"]
        proxy: {provider: azure-dev}
      egress: mediated
      egressEnforcement: true
      egressTransport: forward-proxy
      egressDomainPolicy:
        defaultAction: deny
        allow: [management.azure.com, api.loganalytics.io]
      broker:
        grants:
          - provider: azure-dev
            repositories: []
            resources:
              - arm:/subscriptions/11111111-1111-1111-1111-111111111111
              - query-identity/22222222-2222-2222-2222-222222222222
            materialization: header-inject
            egressHosts: [management.azure.com:443, api.loganalytics.io:443]
            authorization: {preset: observe, resourcePrefix: azure/}
  profileSelection: {defaultProfile: azure-inspection, onNoMatch: useDefault}
