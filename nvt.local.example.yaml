apiVersion: nvt.dev/local/v1

profiles:
  development:
    runtime:
      preset: shell
      autonomy: trusted-local
    editor:
      preset: code-server
    plugins: [work-control, github-watcher]

repositories:
  nvt-agent:
    github: mirkoSekulic/nvt-agent
  studio:
    github: Altinn/altinn-studio
  infrastructure:
    github: Altinn/altinn-platform

workstations:
  - name: nvt
    profile: development
    repositories: [nvt-agent]
  - name: studio
    profile: development
    repositories: [studio]
  - name: infra
    profile: development
    repositories: [infrastructure]

workflows:
  nvt-development:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.github.pr.merged, plugin.github.pr.closed]
  nvt-review:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.work.completed]
      failOn: [plugin.work.failed]
  studio-development:
    profile: development
    repository: studio
    retention: disposable
  infrastructure:
    profile: development
    repository: infrastructure
    retention: retained
