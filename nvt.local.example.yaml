apiVersion: nvt.dev/local/v1

retentionPolicies:
  persistent:
    persistence:
      workspace: true
      runtimeState: true
      dockerData: true
  retained:
    persistence:
      workspace: true
      runtimeState: true
      dockerData: true
    ttl:
      activeSeconds: 86400
  disposable:
    ttl:
      activeSeconds: 604800
      completedSeconds: 300
      failedSeconds: 900
      runRetentionSeconds: 86400

secrets:
  github-key:
    file: ./.nvt-local/secrets/github/app.pem
  studio-token:
    file: ./.nvt-local/secrets/studio/token

accounts:
  github:
    preset: github-app
    appId: "1"
    privateKeySecret: github-key
    installations:
      mirkoSekulic: "1"

brokerProviders:
  studio:
    plugin: token
    config:
      injection-hosts: [altinn.studio]
      injection-git: true
      injection-basic-username: oauth2
      target-mode: literal
    secrets:
      token-file: studio-token
    mediation:
      hosts: [altinn.studio]
      materialization: header-inject
      git: true
      username: oauth2
      targetMode: literal

profiles:
  development:
    runtime:
      preset: shell
      autonomy: trusted-local
    editor:
      preset: code-server
    accounts: [github]
    credentialProviders: [studio]
    defaultCredentialProvider: github
    egress:
      domainPolicy:
        defaultAction: deny
        allow: [github.com, altinn.studio]
        deny: [pastebin.com]
    plugins:
      - work-control
      - name: github-watcher
        when: after-agent
        restart: always
        egress:
          provider: github

repositories:
  nvt-agent:
    github: mirkoSekulic/nvt-agent
    account: github
    access:
      permissions:
        contents: write
        pull_requests: write
        workflows: write
  studio:
    url: https://altinn.studio/repos/altinn/altinn-studio.git
    checkoutTarget: altinn.studio/repos/altinn/altinn-studio
    brokerRepository: altinn.studio/repos/altinn/altinn-studio
    credentialProvider: studio
  infrastructure:
    github: Altinn/altinn-platform

workstations:
  - name: nvt
    profile: development
    repositories: [nvt-agent]
  - name: studio
    profile: development
    repositories: [studio]
  - name: infra
    profile: development
    repositories: [infrastructure]

workflows:
  nvt-development:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.github.pr.merged, plugin.github.pr.closed]
  nvt-review:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.work.completed]
      failOn: [plugin.work.failed]
  studio-development:
    profile: development
    repository: studio
    retention: disposable
  infrastructure:
    profile: development
    repository: infrastructure
    retention: retained
