apiVersion: nvt.dev/local/v1

retentionPolicies:
  persistent:
    persistence:
      workspace: true
      runtimeState: true
      dockerData: true
  disposable:
    ttl:
      activeSeconds: 604800
      completedSeconds: 300
      failedSeconds: 900
      runRetentionSeconds: 86400

secrets:
  github-token:
    file: ./.nvt-local/secrets/github/token

accounts:
  codex:
    preset: codex-oauth

brokerProviders:
  github:
    plugin: token
    config:
      injection-hosts: [github.com, api.github.com]
      injection-git: true
      injection-basic-username: x-access-token
      target-mode: github
    secrets:
      token-file: github-token
    mediation:
      hosts: [github.com, api.github.com]
      materialization: header-inject
      git: true
      username: x-access-token
      targetMode: github

profiles:
  development:
    runtime:
      preset: codex
      autonomy: trusted-local
      account: codex
    editor:
      preset: code-server
    accounts: [codex]
    credentialProviders: [github]
    defaultCredentialProvider: github
    plugins:
      - work-control
      - name: github-watcher
        when: after-agent
        restart: always
        egress:
          provider: github

repositories:
  project:
    url: https://github.com/example-org/example-repo.git
    checkoutTarget: github.com/example-org/example-repo
    brokerRepository: example-org/example-repo
    credentialProvider: github

workstations:
  - name: project
    profile: development
    repositories: [project]

workflows:
  implement:
    profile: development
    repository: project
    retention: disposable
    lifecycle:
      completeOn: [plugin.github.pr.merged, plugin.github.pr.closed]
  review:
    profile: development
    repository: project
    retention: disposable
    lifecycle:
      completeOn: [plugin.work.completed]
      failOn: [plugin.work.failed]
