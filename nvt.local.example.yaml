apiVersion: nvt.dev/local/v1

secrets:
  github-key:
    file: ./.nvt-local/secrets/github/app.pem

accounts:
  github:
    preset: github-app
    appId: "1"
    privateKeySecret: github-key
    installations:
      mirkoSekulic: "1"

profiles:
  development:
    runtime:
      preset: shell
      autonomy: trusted-local
    editor:
      preset: code-server
    accounts: [github]
    defaultRepositoryAccount: github
    plugins:
      - work-control
      - name: github-watcher
        when: after-agent
        restart: always
        egress:
          provider: github

repositories:
  nvt-agent:
    github: mirkoSekulic/nvt-agent
    account: github
    access:
      permissions:
        contents: write
        pull_requests: write
        workflows: write
  studio:
    github: Altinn/altinn-studio
  infrastructure:
    github: Altinn/altinn-platform

workstations:
  - name: nvt
    profile: development
    repositories: [nvt-agent]
  - name: studio
    profile: development
    repositories: [studio]
  - name: infra
    profile: development
    repositories: [infrastructure]

workflows:
  nvt-development:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.github.pr.merged, plugin.github.pr.closed]
  nvt-review:
    profile: development
    repository: nvt-agent
    retention: disposable
    lifecycle:
      completeOn: [plugin.work.completed]
      failOn: [plugin.work.failed]
  studio-development:
    profile: development
    repository: studio
    retention: disposable
  infrastructure:
    profile: development
    repository: infrastructure
    retention: retained
